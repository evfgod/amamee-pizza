<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คิวรอรับสินค้า - AMAMEE PIZZA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; overflow: hidden; background-color: #0F172A; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        /* ปรับแต่ง Scrollbar ให้ดูสะอาดตา */
        ::-webkit-scrollbar { width: 0px; }
        
        .queue-card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="flex h-screen">

    <div class="w-[30%] bg-black relative border-r border-white/10">
        <iframe class="w-full h-full" 
            src="https://www.youtube.com/embed/jU1R4GXhNGU?autoplay=1&mute=1&loop=1&playlist=jU1R4GXhNGU&controls=0" 
            title="Amamee Pizza Video" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
        <div class="absolute top-4 left-4 bg-red-600 text-white px-4 py-1 rounded-full text-xs font-black animate-pulse">
            LIVE PROMOTION
        </div>
    </div>

    <div class="w-[70%] bg-slate-50 flex flex-col relative">
        <div class="bg-red-600 text-white p-8 text-center shadow-2xl relative shrink-0">
            <h1 class="text-7xl font-black italic tracking-tighter">AMAMEE <span class="text-yellow-300">PIZZA</span></h1>
            <p class="text-2xl font-bold mt-2 opacity-90">กรุณารอรับสินค้าเมื่อหมายเลขคิวปรากฏ</p>
            
            <button onclick="toggleFullScreen()" class="absolute top-6 right-6 bg-white/20 hover:bg-white/40 p-3 rounded-2xl transition-all border border-white/30">
                <i id="fs-icon" class="fas fa-expand text-2xl"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-8 space-y-6" id="queue-display">
            <div class="text-center py-40">
                <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-red-600 mb-4"></div>
                <p class="text-slate-400 text-2xl font-bold">ระบบกำลังเชื่อมต่อข้อมูลคิว...</p>
            </div>
        </div>

        <div class="bg-slate-900 text-white p-5 text-center font-bold text-2xl overflow-hidden shrink-0 border-t-4 border-yellow-400">
            <marquee scrollamount="10">
                🍕 ยินดีต้อนรับสู่ AMAMEE PIZZA ฮาลาล 100% สดใหม่ทุกวัน | 📞 ติดต่อสอบถาม/สั่งจองล่วงหน้า โทร. 092-803-6695 | ✨ ขอบคุณที่ไว้วางใจเรา
            </marquee>
        </div>
    </div>

<script>
    // 1. ตั้งค่า API URL (ตรวจสอบให้ตรงกับที่ Deploy ใน Google Apps Script)
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxOP-PzsvYATCXPpnhh0cKyAPJCFHojlLI36XSPB4YoC-l0vIU23D9X4XCrlwyHPBE7PA/exec';

    // แผนผังไอคอนอาหาร
    const iconMap = {
        'ฮาวายเอี้ยน': '🍍', 'แฮมชีส': '🍖', 'แฮมปูอัด': '🦀', 'ไก่กรอบ': '🍗',
        'ข้าวโพด': '🌽', 'ฮอตดอก': '🌭', 'ชีสเลิฟเวอร์': '🧀', 'ซีฟู้ด': '🍤',
        'ผักโขม': '🌿', 'หน้ารวม': '🍕', 'โรตี': '🫓', 'มะตะบะ': '🐔'
    };

    // 2. ฟังก์ชันดึงข้อมูลแบบ JSONP
    function fetchQueue() {
        const oldScript = document.getElementById('jsonp-script');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = 'jsonp-script';
        script.src = `${WEB_APP_URL}?action=getQueues&callback=renderDisplay&t=${Date.now()}`;
        document.body.appendChild(script);
    }

    // 3. ฟังก์ชันการแสดงผลบนหน้าจอ
    window.renderDisplay = function(data) {
        const container = document.getElementById('queue-display');
        
        if (!data || data.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-slate-300">
                    <i class="fas fa-pizza-slice text-9xl mb-6 opacity-10"></i>
                    <p class="text-4xl font-black italic">ยังไม่มีรายการคิวรอปรุง</p>
                </div>`;
            return;
        }

        // กรองแสดงเฉพาะสถานะที่ต้องโชว์บนจอ
        const displayData = data.filter(item => 
            item.status === 'รอดำเนินการ' || item.status === 'กำลังปรุง'
        );

        if (displayData.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-slate-300">
                    <i class="fas fa-smile-wink text-9xl mb-6 opacity-10"></i>
                    <p class="text-4xl font-black italic">ดำเนินการครบทุกคิวแล้วจ้า!</p>
                </div>`;
            return;
        }

        container.innerHTML = displayData.map(q => {
            const isWorking = q.status === 'กำลังปรุง';
            // สกัดเลขคิวจาก Format: (คิว 5) รายการ...
            const qNumberMatch = q.items.match(/\(คิว (\d+)\)/);
            const qNumber = qNumberMatch ? qNumberMatch[1] : '?';

            // ตกแต่งรายการอาหารและไอคอน
            const itemsList = q.items
                .replace(/\(คิว \d+\) /g, '') 
                .split(',')
                .map(item => {
                    const cleanItem = item.trim();
                    const icon = Object.keys(iconMap).find(key => cleanItem.includes(key)) ? iconMap[Object.keys(iconMap).find(key => cleanItem.includes(key))] : '🍕';
                    return `<span>${icon} ${cleanItem.replace('x', '×')}</span>`;
                })
                .join(' <span class="mx-2 opacity-30">|</span> ');

            return `
            <div class="queue-card bg-white border-l-[30px] ${isWorking ? 'border-orange-500 shadow-2xl blink' : 'border-slate-300 shadow-lg'} rounded-[3.5rem] p-10 flex items-center justify-between mb-8">
                <div class="flex flex-col items-start min-w-[300px]">
                    <p class="text-slate-400 font-black text-xl mb-1 uppercase tracking-widest">QUEUE NO.</p>
                    <h2 class="text-[160px] font-black text-slate-800 leading-none italic tracking-tighter">#${qNumber}</h2>
                </div>
                <div class="flex-1 flex flex-col items-end">
                    <div class="${isWorking ? 'bg-orange-500 text-white' : 'bg-slate-200 text-slate-600'} px-10 py-3 rounded-2xl text-4xl font-black mb-8 shadow-sm">
                        <i class="fas ${isWorking ? 'fa-fire-alt' : 'fa-clock'} mr-4"></i>${isWorking ? 'กำลังปรุง...' : 'รอดำเนินการ'}
                    </div>
                    <div class="text-4xl font-extrabold text-slate-700 text-right leading-relaxed">
                        ${itemsList}
                    </div>
                </div>
            </div>`;
        }).join('');
    };

    // 4. ระบบ Fullscreen
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            document.getElementById('fs-icon').classList.replace('fa-expand', 'fa-compress');
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                document.getElementById('fs-icon').classList.replace('fa-compress', 'fa-expand');
            }
        }
    }

    // เริ่มต้นระบบ
    fetchQueue();
    // ตรวจสอบคิวใหม่ทุก 8 วินาที
    setInterval(fetchQueue, 8000);
</script>
</body>
</html>
