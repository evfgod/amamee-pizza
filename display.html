<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คิวรอรับสินค้า - AMAMEE PIZZA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; overflow: hidden; background-color: #0F172A; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        /* ปรับแต่ง Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #E11D48; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen">

    <div class="w-[35%] bg-black relative">
        <iframe class="w-full h-full" 
            src="https://www.youtube.com/embed/jU1R4GXhNGU?autoplay=1&mute=1&loop=1&playlist=jU1R4GXhNGU&controls=0" 
            title="Amamee Pizza Video" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
        <div class="absolute bottom-4 left-4 bg-black/50 text-white p-3 rounded-xl backdrop-blur-sm text-xs border border-white/10">
            <p>🔴 กำลังเล่น: บรรยากาศร้าน</p>
        </div>
    </div>

    <div class="w-[65%] bg-slate-50 flex flex-col relative">
        <div class="bg-red-600 text-white p-8 text-center shadow-2xl relative shrink-0">
            <h1 class="text-6xl font-black italic tracking-tighter">AMAMEE <span class="text-yellow-300">PIZZA</span></h1>
            <p class="text-2xl font-bold mt-2 opacity-90">กรุณารอเรียกหมายเลขคิวของคุณ</p>
            
            <button onclick="toggleFullScreen()" class="absolute top-6 right-6 bg-white/20 hover:bg-white/40 p-3 rounded-2xl transition-all border border-white/30">
                <i id="fs-icon" class="fas fa-expand text-2xl"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-8 space-y-6" id="queue-display">
            <div class="text-center py-20">
                <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-red-600 mb-4"></div>
                <p class="text-slate-400 text-2xl font-bold">กำลังอัปเดตคิวล่าสุด...</p>
            </div>
        </div>

        <div class="bg-slate-900 text-white p-4 text-center font-bold text-xl overflow-hidden shrink-0">
            <marquee scrollamount="8">ยินดีต้อนรับสู่ AMAMEE PIZZA ฮาลาล 100% | ติดต่อสอบถาม/สั่งจองล่วงหน้า โทร. 092-803-6695</marquee>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw4eN6LuD_SMgXI5j_Hs1pVdd3emzBoz4nViUmL6LzUzRoL0AirJMRZrYwBqphgyee3yw/exec'; 

        // แมพไอคอนตามชื่อเมนู
        const iconMap = {
            'ฮาวายเอี้ยน': '🍍', 'แฮมชีส': '🍖', 'แฮมปูอัดชีส': '🦀', 'ไก่กรอบชีส': '🍗',
            'ข้าวโพดอบชีส': '🌽', 'ฮอตดอกชีส': '🌭', 'ชีสเลิฟเวอร์': '🧀', 'ซีฟู้ด': '🍤',
            'ผักโขมชีส': '🌿', 'หน้ารวม': '🍕', 'เพิ่มชีส': '➕🧀', 'โรตี': '🫓', 'มะตะบะ': '🐔'
        };

        function fetchQueue() {
            window.callback = function(data) {
                renderDisplay(data);
                const oldScript = document.getElementById('jsonp-script');
                if (oldScript) oldScript.remove();
            };

            const script = document.createElement('script');
            script.id = 'jsonp-script';
            script.src = `${WEB_APP_URL}?action=getHistory&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        function renderDisplay(data) {
            const container = document.getElementById('queue-display');
            
            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-300">
                        <i class="fas fa-clipboard-list text-9xl mb-6 opacity-20"></i>
                        <p class="text-3xl font-bold italic">ยังไม่มีรายการคิวในขณะนี้</p>
                    </div>`;
                return;
            }

            const activeQueues = data.filter(item => 
                item.status === 'รอดำเนินการ' || item.status === 'กำลังดำเนินการ'
            );

            if (activeQueues.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-300">
                        <i class="fas fa-check-circle text-9xl mb-6 opacity-20"></i>
                        <p class="text-3xl font-bold italic">ดำเนินการครบทุกคิวแล้ว ขอบคุณค่ะ</p>
                    </div>`;
                return;
            }

            container.innerHTML = activeQueues.map(q => {
                const isWorking = q.status === 'กำลังดำเนินการ';
                const qNumberMatch = q.items.match(/\(คิว (\d+)\)/);
                const qNumber = qNumberMatch ? qNumberMatch[1] : '?';

                // จัดการรายการอาหาร + ใส่ Icon
                const itemsList = q.items
                    .replace(/\(คิว \d+\) /g, '') 
                    .split(',')
                    .map(item => {
                        const cleanItem = item.trim();
                        const nameOnly = cleanItem.split('x')[0];
                        const icon = Object.keys(iconMap).find(key => nameOnly.includes(key)) ? iconMap[Object.keys(iconMap).find(key => nameOnly.includes(key))] : '🍕';
                        return `<div class="flex items-center gap-3">
                                    <span class="text-4xl">${icon}</span>
                                    <span>${cleanItem.replace('x', ' × ')}</span>
                                </div>`;
                    })
                    .join('');

                return `
                <div class="bg-white border-l-[25px] ${isWorking ? 'border-orange-500 shadow-2xl blink' : 'border-slate-300 shadow-lg'} rounded-[3rem] p-10 flex items-center justify-between transition-all">
                    
                    <div class="flex flex-col items-start min-w-[320px]">
                        <p class="text-slate-400 font-black text-xl mb-1 uppercase tracking-tighter">QUEUE NUMBER</p>
                        <h2 class="text-[140px] font-black text-slate-800 leading-none italic">#${qNumber}</h2>
                    </div>

                    <div class="flex-1 flex flex-col items-end">
                        <div class="${isWorking ? 'bg-orange-500 text-white' : 'bg-slate-200 text-slate-600'} px-10 py-3 rounded-2xl text-3xl font-black mb-6 shadow-sm">
                            <i class="fas ${isWorking ? 'fa-fire-alt' : 'fa-clock'} mr-3"></i>${isWorking ? 'กำลังปรุงอาหาร...' : 'รอดำเนินการ'}
                        </div>
                        
                        <div class="space-y-3 text-4xl font-extrabold text-slate-700 text-right">
                            ${itemsList}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function toggleFullScreen() {
            const icon = document.getElementById('fs-icon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                icon.classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    icon.classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

        // เช็คการเปลี่ยนสถานะ Fullscreen (กด F11)
        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fs-icon');
            if (!document.fullscreenElement) {
                icon.classList.replace('fa-compress', 'fa-expand');
            } else {
                icon.classList.replace('fa-expand', 'fa-compress');
            }
        });

        // อัปเดตข้อมูลอัตโนมัติทุก 10 วินาที
        setInterval(fetchQueue, 10000);
        window.onload = fetchQueue;
    </script>
</body>
</html>
