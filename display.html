<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คิวรอรับสินค้า - AMAMEE PIZZA
    <div class="bg-red-600 text-white p-6 text-center shadow-lg relative">
    <h1 class="text-5xl font-black italic">AMAMEE PIZZA</h1>
    <p class="text-xl font-bold mt-2">กรุณารอเรียกหมายเลขคิว</p>
    
    <button onclick="toggleFullScreen()" class="absolute top-6 right-6 bg-white/20 hover:bg-white/40 p-3 rounded-2xl transition-all">
        <i id="fs-icon" class="fas fa-expand text-2xl"></i>
    </button>
</div>
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; overflow: hidden; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body class="flex bg-slate-900 h-screen">

    <div class="w-[30%] bg-black">
        <iframe class="w-full h-full" 
    src="https://www.youtube.com/embed/jU1R4GXhNGU?autoplay=1&mute=1&loop=1&playlist=jU1R4GXhNGU" 
    title="Amamee Pizza Video" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    referrerpolicy="strict-origin-when-cross-origin" 
    allowfullscreen>
</iframe>
    </div>

    <div class="w-[70%] bg-white flex flex-col">
        <div class="bg-red-600 text-white p-6 text-center shadow-lg">
            <h1 class="text-5xl font-black italic">AMAMEE PIZZA</h1>
            <p class="text-xl font-bold mt-2">กรุณารอเรียกหมายเลขคิว</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6" id="queue-display">
            <div class="text-center py-20">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-red-600 mb-4"></div>
                <p class="text-slate-400 text-xl font-bold">กำลังโหลดข้อมูลคิว...</p>
            </div>
        </div>
    </div>

    <script>
        // *** ใช้ URL เดียวกับหน้า POS ***
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxIWbaUgC_Zb3edUewfRkH_mLCgBBZ_3YB9SlvBK2Bl5-pTvvOOSxLQyCzT0g3CoqYJ5g/exec'; 

        function fetchQueue() {
            window.callback = function(data) {
                renderDisplay(data);
                const oldScript = document.getElementById('jsonp-script');
                if (oldScript) oldScript.remove();
            };

            const script = document.createElement('script');
            script.id = 'jsonp-script';
            script.src = `${WEB_APP_URL}?action=getHistory&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        function renderDisplay(data) {
            const container = document.getElementById('queue-display');
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="text-center py-20 text-slate-300 text-2xl font-bold">ไม่มีคิวในขณะนี้</div>';
                return;
            }

            const activeQueues = data.filter(item => 
                item.status === 'รอดำเนินการ' || item.status === 'กำลังดำเนินการ'
            );

            if (activeQueues.length === 0) {
                container.innerHTML = '<div class="text-center py-20 text-slate-300 text-2xl font-bold">ไม่มีคิวในขณะนี้</div>';
                return;
            }

            container.innerHTML = activeQueues.map(q => {
                const isWorking = q.status === 'กำลังดำเนินการ';
                
                // 1. ดึงเลขคิว
                const qNumberMatch = q.items.match(/\(คิว (\d+)\)/);
                const qNumber = qNumberMatch ? qNumberMatch[1] : '?';

                // 2. จัดการรายการอาหาร (แยกบรรทัด และเติมคำว่า "ถาด")
                const itemsList = q.items
                    .replace(/\(คิว \d+\) /g, '') 
                    .split(',')
                    .map(item => item.trim().replace('x', ' ') + ' ถาด')
                    .join('<br>');

                return `
                <div class="bg-white border-l-[20px] ${isWorking ? 'border-orange-500 shadow-orange-100 blink' : 'border-slate-300'} rounded-[2rem] p-8 shadow-2xl mb-8 flex items-start justify-between min-h-[250px]">
                    
                    <div class="flex flex-col justify-center h-full min-w-[300px]">
                        <h2 class="text-[120px] font-black text-slate-800 leading-none">คิวที่ ${qNumber}</h2>
                    </div>

                    <div class="flex-1 flex flex-col items-end">
                        <div class="${isWorking ? 'bg-orange-500 text-white' : 'bg-slate-200 text-slate-600'} px-8 py-2 rounded-full text-3xl font-black uppercase mb-6">
                            ${isWorking ? 'กำลังดำเนินการ' : 'รอดำเนินการ'}
                        </div>
                        
                        <div class="text-4xl font-bold text-slate-600 text-right leading-relaxed">
                            ${itemsList}
                        </div>
                    </div>

                </div>
                `;
            }).join('');
        }
        function toggleFullScreen() {
            const icon = document.getElementById('fs-icon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                icon.classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    icon.classList.replace('fa-compress', 'fa-expand');
                }
            }
        }
        function initMenu() {
    document.getElementById('menu-grid').innerHTML = menu.map(p => {
        // กำหนดสีพื้นหลังตามประเภทสินค้า (ตัวอย่าง: Pizza สีแดง, โรตีสีส้ม, อื่นๆ สีฟ้า)
        let iconBg = 'bg-slate-100';
        if (p.id.startsWith('H')) iconBg = 'bg-red-50'; // หมวดพิซซ่า
        if (p.id.startsWith('R')) iconBg = 'bg-orange-50'; // หมวดโรตี
        if (p.id.startsWith('S')) iconBg = 'bg-yellow-50'; // หมวดเพิ่มชีส

        return `
            <div class="bg-white p-4 rounded-[2rem] shadow-sm border border-slate-100 text-center active:scale-95 transition-all flex flex-col items-center justify-between gap-2 h-full" 
                 onclick="add('${p.id}')">
                <div class="w-16 h-16 ${iconBg} rounded-2xl flex items-center justify-center text-4xl shadow-inner mb-1">
                    ${p.icon}
                </div>
                <div class="space-y-1">
                    <div class="font-extrabold text-sm text-slate-700 leading-tight">${p.name}</div>
                    <div class="text-red-500 font-black text-base">฿${p.price}</div>
                </div>
                <div class="mt-1 w-8 h-8 bg-slate-50 rounded-full flex items-center justify-center text-slate-300 text-xs">
                    <i class="fas fa-plus"></i>
                </div>
            </div>
        `;
    }).join('');
}
        
        // อัปเดตไอคอนหากกด F11 บนคีย์บอร์ด
        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fs-icon');
            if (!document.fullscreenElement) {
                icon.classList.replace('fa-compress', 'fa-expand');
            } else {
                icon.classList.replace('fa-expand', 'fa-compress');
            }
        });

        // อัปเดตข้อมูลอัตโนมัติทุก 10 วินาที
        setInterval(fetchQueue, 10000);
        window.onload = fetchQueue;
    </script>
</body>
</html>
