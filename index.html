<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMAMEE PIZZA POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    :root { --brand-red: #E11D48; }
    body { font-family: 'Sarabun', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
    .active-tab { color: var(--brand-red) !important; border-top: 2px solid var(--brand-red); }
    .blink { animation: blinker 1.5s linear infinite; }
    @keyframes blinker { 50% { opacity: 0; } }

    /* เพิ่มส่วนนี้เข้าไปครับ */
    @media print {
        body * { visibility: hidden; }
        #receipt-print, #receipt-print * { visibility: visible; }
        #receipt-print {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            display: block !important;
        }
        @page { margin: 0; }
    }
</style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-[#0F172A] text-white px-5 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-red-600 p-2 rounded-xl"><i class="fas fa-pizza-slice"></i></div>
            <h1 class="text-xl font-black italic uppercase">AMAMEE <span class="text-red-500">PIZZA</span></h1>
        </div>
            <button onclick="toggleFullScreen()" id="fs-btn" class="ml-2 text-[10px] bg-white/10 hover:bg-blue-600 px-3 py-1 rounded-lg transition-colors font-bold uppercase border border-white/20">
        <i class="fas fa-expand mr-1"></i> Full Screen
        </button>
        <button onclick="resetAllQueues()" class="text-[10px] bg-white/10 hover:bg-red-600 px-3 py-1 rounded-lg transition-colors font-bold uppercase border border-white/20">
            <i class="fas fa-redo-alt mr-1"></i> Reset Q1
        </button>
        
    </header>

    <main class="flex-1 overflow-y-auto pb-32">
        <div id="view-pos" class="p-4">
            <div id="menu-grid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <div id="view-queue" class="hidden p-4 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-black italic uppercase text-slate-800">Orders in Queue</h2>
                <span id="queue-count-text" class="text-xs font-bold text-slate-400">0 รายการ</span>
            </div>
            <div id="queue-list" class="space-y-3"></div>
        </div>

        <div id="view-history" class="hidden p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black italic uppercase text-slate-800">History</h2>
                <button onclick="syncHistory()" class="p-2 text-slate-400"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="history-list" class="space-y-3"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center py-2 z-50">
        <button onclick="switchView('pos')" id="btn-pos" class="active-tab text-slate-400 flex flex-col items-center gap-1 w-full py-1">
            <i class="fas fa-th-large text-xl"></i><span class="text-[10px] font-black">MENU</span>
        </button>
        <button onclick="switchView('queue')" id="btn-queue" class="text-slate-400 flex flex-col items-center gap-1 w-full py-1 relative">
            <i class="fas fa-list-check text-xl"></i>
            <span id="badge-queue" class="absolute top-0 right-6 bg-red-600 text-white text-[10px] w-5 h-5 rounded-full border-2 border-white flex items-center justify-center hidden">0</span>
            <span class="text-[10px] font-black">QUEUE</span>
        </button>
        <button onclick="switchView('history')" id="btn-history" class="text-slate-400 flex flex-col items-center gap-1 w-full py-1">
            <i class="fas fa-history text-xl"></i><span class="text-[10px] font-black">HISTORY</span>
        </button>
    </nav>

    <div id="cart-preview" onclick="toggleCart()" class="fixed bottom-24 left-4 right-4 bg-red-600 text-white p-4 rounded-2xl flex justify-between items-center shadow-2xl z-40 hidden transition-all">
        <div class="flex items-center gap-3">
            <span id="cart-count" class="bg-white text-red-600 px-2 rounded-lg font-black text-sm">0</span>
            <span class="font-bold">รายการ</span>
        </div>
        <span id="cart-total" class="text-xl font-black italic">฿0</span>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-[2.5rem] h-[80vh] flex flex-col overflow-hidden">
            <div class="p-6 text-center border-b shrink-0 relative">
                <h3 class="text-xl font-black">ยืนยันรายการ</h3>
                <button onclick="toggleCart()" class="absolute right-6 top-6 text-slate-300"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
            <div class="p-8 bg-slate-50 border-t space-y-4">
                <div class="flex justify-between items-end">
                    <span class="text-slate-400 font-bold uppercase text-xs">ยอดรวม</span>
                    <span id="modal-total" class="text-4xl font-black text-red-600">฿0</span>
                </div>
                <button onclick="pushToQueue()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-all">
                    <i class="fas fa-paper-plane mr-2"></i>จองคิวและเริ่มทำ
                </button>
            </div>
        </div>
    </div>

    <div id="payment-modal" class="fixed inset-0 bg-slate-900/95 z-[70] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 space-y-6">
            <div class="text-center">
                <p id="pay-label" class="text-slate-400 font-bold text-xs uppercase mb-1"></p>
                <h2 id="pay-amount" class="text-5xl font-black italic">฿0</h2>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="selectMethod('CASH')" class="border-2 border-slate-100 focus:border-red-500 p-4 rounded-2xl flex flex-col items-center">
                    <i class="fas fa-money-bill-wave text-emerald-500 mb-1"></i>
                    <span class="text-[10px] font-bold">เงินสด</span>
                </button>
                <button onclick="selectMethod('TRANSFER')" class="border-2 border-slate-100 focus:border-blue-500 p-4 rounded-2xl flex flex-col items-center">
                    <i class="fas fa-mobile-alt text-blue-500 mb-1"></i>
                    <span class="text-[10px] font-bold">เงินโอน</span>
                </button>
            </div>
            <div id="cash-box" class="space-y-4 hidden">
                <input type="number" id="cash-in" oninput="doChange()" inputmode="decimal" placeholder="รับเงินมา..." class="w-full text-3xl font-black text-center py-4 border-2 border-slate-100 rounded-2xl outline-none">
                <div id="change-display" class="flex justify-between items-center p-4 rounded-xl bg-slate-50 text-slate-400">
                    <span id="change-label" class="font-bold text-xs uppercase">เงินทอน</span>
                    <span id="change-text" class="text-2xl font-black">฿0</span>
                </div>
            </div>
            <button id="btn-final" onclick="processPayment()" class="w-full bg-slate-300 text-white py-5 rounded-2xl font-black text-xl" disabled>ยืนยันบันทึกประวัติ</button>
            <button onclick="closePayment()" class="w-full text-slate-400 font-bold text-sm">ย้อนกลับ</button>
        </div>
    </div>
    <div id="receipt-print" class="hidden" style="width: 58mm; padding: 5px; font-family: 'Sarabun', sans-serif;">
    <div style="text-align: center;">
        <h2 style="font-size: 20px; font-weight: bold; margin: 0;">AMAMEE PIZZA</h2>
        <p style="font-size: 12px; margin: 5px 0;">*** ใบเสร็จรับเงิน ***</p>
    </div>
    <div style="border-top: 1px dashed black; margin: 10px 0;"></div>
    <div id="receipt-details" style="font-size: 13px;">
        </div>
    <div style="border-top: 1px dashed black; margin: 10px 0;"></div>
    <div style="text-align: center; font-size: 12px; margin-top: 10px;">
        ขอบคุณที่อุดหนุนครับ/ค่ะ<br>
        LINEMAN Order
    </div>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxIWbaUgC_Zb3edUewfRkH_mLCgBBZ_3YB9SlvBK2Bl5-pTvvOOSxLQyCzT0g3CoqYJ5g/exec'; 

    let cart = [];
    let queue = JSON.parse(localStorage.getItem('amamee_local_queue')) || [];
    let queueCounter = parseInt(localStorage.getItem('amamee_q_counter')) || 1;
    let currentOrder = null;
    
    const menu = [
        { id: 'H01', name: 'ฮาวายเอี้ยน', price: 59, icon: '🍍' },
        { id: 'H02', name: 'แฮมชีส', price: 59, icon: '🍖' },
        { id: 'H03', name: 'แฮมปูอัดชีส', price: 59, icon: '🦀' },
        { id: 'H04', name: 'ไก่กรอบชีส', price: 59, icon: '🍗' },
        { id: 'H05', name: 'ข้าวโพดอบชีส', price: 59, icon: '🌽' },
        { id: 'H06', name: 'ฮอตดอกชีส', price: 59, icon: '🌭' },
        { id: 'H07', name: 'ชีสเลิฟเวอร์', price: 69, icon: '🧀' },
        { id: 'H08', name: 'ซีฟู้ด', price: 69, icon: '🍤' },
        { id: 'H09', name: 'ผักโขมชีส', price: 69, icon: '🌿' },
        { id: 'H10', name: 'หน้ารวม', price: 79, icon: '🍕' },
        { id: 'S01', name: 'เพิ่มชีส', price: 20, icon: '🧀' }
    ];

    // --- ระบบนำทางและการแสดงผล ---
    function switchView(id) {
        ['pos', 'queue', 'history'].forEach(v => {
            document.getElementById('view-'+v).classList.add('hidden');
            document.getElementById('btn-'+v).classList.remove('active-tab');
        });
        document.getElementById('view-'+id).classList.remove('hidden');
        document.getElementById('btn-'+id).classList.add('active-tab');
        if(id === 'queue') renderQueue();
        if(id === 'history') syncHistory();
    }

    function initMenu() {
        document.getElementById('menu-grid').innerHTML = menu.map(p => `
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-50 text-center active:scale-95 transition-all" onclick="add('${p.id}')">
                <div class="text-4xl mb-2">${p.icon}</div>
                <div class="font-extrabold text-sm text-slate-700">${p.name}</div>
                <div class="text-red-500 font-black">฿${p.price}</div>
            </div>
        `).join('');
    }

    // --- ระบบตระกร้าสินค้า ---
    function add(id) {
        const p = menu.find(x => x.id === id);
        const item = cart.find(x => x.id === id);
        if(item) item.qty++; else cart.push({...p, qty: 1});
        updateUI();
    }

    function updateUI() {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const count = cart.reduce((s, i) => s + i.qty, 0);
        document.getElementById('cart-preview').classList.toggle('hidden', cart.length === 0);
        document.getElementById('cart-count').innerText = count;
        document.getElementById('cart-total').innerText = `฿${total}`;
        document.getElementById('modal-total').innerText = `฿${total}`;
        document.getElementById('cart-items').innerHTML = cart.map(i => `
            <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl">
                <div><p class="font-bold">${i.name}</p><p class="text-xs text-slate-400">฿${i.price}</p></div>
                <div class="flex items-center gap-4">
                    <button onclick="changeQty('${i.id}', -1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-bold text-red-500">-</button>
                    <span class="font-black text-lg">${i.qty}</span>
                    <button onclick="changeQty('${i.id}', 1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-bold text-blue-500">+</button>
                </div>
            </div>
        `).join('');
    }

    function changeQty(id, d) {
        const item = cart.find(x => x.id === id);
        if(item) {
            item.qty += d;
            if(item.qty <= 0) cart = cart.filter(x => x.id !== id);
            updateUI();
        }
    }

    function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }

    // --- ระบบคิว ---
    async function pushToQueue() {
        if (cart.length === 0) return;
        const now = new Date();
        const order = {
            uid: Date.now(),
            q_no: queueCounter,
            date: now.toLocaleDateString('th-TH'),
            time: now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
            summary: cart.map(i => `${i.name}x${i.qty}`).join(', '),
            total: cart.reduce((s, i) => s + (i.price * i.qty), 0),
            status: 'รอดำเนินการ',
            method: 'รอกดจ่ายเงิน'
        };

        const params = new URLSearchParams({
            action: 'saveQueue',
            date: order.date,
            time: order.time,
            items: `(คิว ${order.q_no}) ${order.summary}`,
            total: order.total
        });
        
        fetch(`${WEB_APP_URL}?${params.toString()}`, { mode: 'no-cors' });
        queue.push(order);
        queueCounter++;
        localStorage.setItem('amamee_q_counter', queueCounter);
        saveQueue();
        cart = [];
        updateUI();
        toggleCart();
        switchView('queue');
    }

    function saveQueue() {
        localStorage.setItem('amamee_local_queue', JSON.stringify(queue));
        renderQueue();
    }

    function renderQueue() {
        const list = document.getElementById('queue-list');
        const badge = document.getElementById('badge-queue');
        badge.innerText = queue.length;
        badge.classList.toggle('hidden', queue.length === 0);
        document.getElementById('queue-count-text').innerText = `${queue.length} รายการ`;

        list.innerHTML = queue.map(q => `
            <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-50 space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400">${q.time}</p>
                        <h3 class="text-2xl font-black text-slate-800 italic">คิวที่ ${q.q_no}</h3>
                    </div>
                    <div class="bg-red-50 text-red-600 px-4 py-1 rounded-full text-xs font-black uppercase">${q.status}</div>
                </div>
                <p class="text-slate-600 font-bold text-sm">${q.summary}</p>
                <div class="flex gap-2 pt-2">
                    <button onclick="cancelOrder(${q.uid})" class="flex-1 bg-slate-100 text-slate-500 py-3 rounded-xl font-bold">ยกเลิก</button>
                    <button onclick="changeStatus(${q.uid}, 'กำลังดำเนินการ')" class="flex-1 bg-orange-100 text-orange-600 py-3 rounded-xl font-bold">เริ่มทำ</button>
                    <button onclick="openPay(${q.uid})" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold">จ่ายเงิน</button>
                </div>
            </div>
        `).join('');
    }

    // --- ระบบชำระเงินและพิมพ์ใบเสร็จ ---
    function openPay(uid) {
        currentOrder = queue.find(q => q.uid === uid);
        if(!currentOrder) return;
        document.getElementById('pay-label').innerText = `คิวที่ ${currentOrder.q_no} ยอดชำระ`;
        document.getElementById('pay-amount').innerText = `฿${currentOrder.total}`;
        document.getElementById('payment-modal').classList.remove('hidden');
        document.getElementById('cash-box').classList.add('hidden');
    }

    function selectMethod(method) {
        currentOrder.method = method === 'CASH' ? 'เงินสด' : 'เงินโอน';
        document.getElementById('cash-box').classList.toggle('hidden', method !== 'CASH');
        const btn = document.getElementById('btn-final');
        if (method !== 'CASH') {
            btn.disabled = false;
            btn.className = "w-full bg-red-600 text-white py-5 rounded-2xl font-black text-xl";
        } else { doChange(); }
    }

    function doChange() {
        const received = parseFloat(document.getElementById('cash-in').value) || 0;
        const diff = received - currentOrder.total;
        const btn = document.getElementById('btn-final');
        document.getElementById('change-text').innerText = `฿${diff >= 0 ? diff : 0}`;
        btn.disabled = received < currentOrder.total;
        btn.className = btn.disabled ? "w-full bg-slate-300 text-white py-5 rounded-2xl font-black text-xl" : "w-full bg-red-600 text-white py-5 rounded-2xl font-black text-xl";
    }

        async function processPayment() {
            const btn = document.getElementById('btn-final');
            btn.disabled = true; 
            btn.innerHTML = 'กำลังบันทึกและพิมพ์...';
            
            const params = new URLSearchParams({ action: 'saveSale', time: currentOrder.time, method: currentOrder.method });
            
            try {
                await fetch(`${WEB_APP_URL}?${params.toString()}`, { mode: 'no-cors' });
                
                // --- ส่วนการเตรียมใบเสร็จ ---
                const details = document.getElementById('receipt-details');
                
                // แยกรายการอาหารให้สวยงาม
                const itemsHtml = currentOrder.summary.split(',').map(i => {
                    const part = i.trim().split('x');
                    return `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                            <span>${part[0]}</span>
                            <span>x${part[1] || '1'}</span>
                        </div>`;
                }).join('');
                
                details.innerHTML = `
                    <div style="display: flex; justify-content: space-between; font-weight: bold;">
                        <span>คิวที่: ${currentOrder.q_no}</span>
                        <span>${currentOrder.time}</span>
                    </div>
                    <div style="margin: 10px 0; border-top: 0.5px solid #eee; padding-top: 5px;">
                        ${itemsHtml}
                    </div>
                    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-top: 5px; border-top: 1px solid black; padding-top: 5px;">
                        <span>ยอดรวมทั้งสิ้น:</span>
                        <span>฿${currentOrder.total}</span>
                    </div>
                    <div style="font-size: 11px; margin-top: 5px; color: #666;">ชำระโดย: ${currentOrder.method}</div>
                `;
        
                // สั่งปริ้น
                setTimeout(() => {
                    window.print(); 
                    // จัดการหน้าจอหลังปริ้นเสร็จ
                    queue = queue.filter(q => q.uid !== currentOrder.uid);
                    saveQueue();
                    closePayment();
                    switchView('history');
                }, 500); // หน่วงเวลานิดนึงเพื่อให้ HTML เรนเดอร์เสร็จก่อนปริ้น
                
            } catch (e) { 
                alert("เกิดข้อผิดพลาดในการบันทึก"); 
                btn.disabled = false; 
                btn.innerHTML = 'ยืนยันบันทึกประวัติ';
            }
        }
    function closePayment() { document.getElementById('payment-modal').classList.add('hidden'); }

    // --- ระบบเสริม (Fullscreen / History / Reset) ---
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            document.getElementById('fs-btn').innerHTML = '<i class="fas fa-compress mr-1"></i> Exit Full';
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                document.getElementById('fs-btn').innerHTML = '<i class="fas fa-expand mr-1"></i> Full Screen';
            }
        }
    }

    function resetAllQueues() {
        if(confirm('รีเซ็ตคิวเป็น Q1 หรือไม่? ข้อมูลปัจจุบันจะหายไป')) {
            queue = []; queueCounter = 1;
            localStorage.setItem('amamee_q_counter', 1);
            saveQueue();
        }
    }

    function syncHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '<div class="text-center py-10">กำลังโหลด...</div>';
        window.callback = function(data) {
            list.innerHTML = data.reverse().map(h => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border mb-3 flex justify-between items-center ${h.status === 'ยกเลิก' ? 'opacity-50' : ''}">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400">${h.time}</p>
                        <p class="text-sm font-bold text-slate-700">${h.items}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-red-600">฿${h.total}</p>
                        <p class="text-[9px] text-slate-300">${h.method}</p>
                    </div>
                </div>`).join('');
        };
        const script = document.createElement('script');
        script.src = `${WEB_APP_URL}?action=getHistory&t=${Date.now()}`;
        document.body.appendChild(script);
    }

    window.onload = () => { initMenu(); renderQueue(); };
</script>
</body>
</html>
