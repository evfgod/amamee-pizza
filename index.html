<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMAMEE PIZZA POS - V5</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --brand-red: #E11D48; }
        body { font-family: 'Sarabun', sans-serif; background-color: #F8FAFC; -webkit-tap-highlight-color: transparent; }
        .active-tab { color: var(--brand-red) !important; border-top: 2px solid var(--brand-red); }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        @media print {
            body * { visibility: hidden; }
            #receipt-print, #receipt-print * { visibility: visible; }
            #receipt-print {
                position: absolute; left: 0; top: 0; width: 100%; display: block !important;
            }
            @page { margin: 0; }
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-[#0F172A] text-white px-5 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-red-600 p-2 rounded-xl"><i class="fas fa-pizza-slice"></i></div>
            <h1 class="text-xl font-black italic uppercase">AMAMEE <span class="text-red-500">PIZZA</span></h1>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleFullScreen()" class="text-[10px] bg-white/10 px-3 py-1 rounded-lg font-bold border border-white/20">
                <i class="fas fa-expand mr-1"></i> FULL
            </button>
            <button onclick="resetAllQueues()" class="text-[10px] bg-white/10 px-3 py-1 rounded-lg font-bold border border-white/20">
                <i class="fas fa-redo-alt mr-1"></i> RESET Q1
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto pb-32">
        <div id="view-pos" class="p-4">
            <div id="menu-grid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <div id="view-queue" class="hidden p-4 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-black italic uppercase text-slate-800">Orders in Queue</h2>
                <span id="queue-count-text" class="text-xs font-bold text-slate-400 font-bold uppercase">0 รายการ</span>
            </div>
            <div id="queue-list" class="space-y-3"></div>
        </div>

        <div id="view-history" class="hidden p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black italic uppercase text-slate-800">Sales History</h2>
                <button onclick="syncHistory()" class="p-2 text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="history-list" class="space-y-3"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center py-2 z-50">
        <button onclick="switchView('pos')" id="btn-pos" class="active-tab text-slate-400 flex flex-col items-center gap-1 w-full py-1">
            <i class="fas fa-th-large text-xl"></i><span class="text-[10px] font-black">MENU</span>
        </button>
        <button onclick="switchView('queue')" id="btn-queue" class="text-slate-400 flex flex-col items-center gap-1 w-full py-1 relative">
            <i class="fas fa-list-check text-xl"></i>
            <span id="badge-queue" class="absolute top-0 right-6 bg-red-600 text-white text-[10px] w-5 h-5 rounded-full border-2 border-white flex items-center justify-center hidden">0</span>
            <span class="text-[10px] font-black">QUEUE</span>
        </button>
        <button onclick="switchView('history')" id="btn-history" class="text-slate-400 flex flex-col items-center gap-1 w-full py-1">
            <i class="fas fa-history text-xl"></i><span class="text-[10px] font-black">HISTORY</span>
        </button>
    </nav>

    <div id="cart-preview" onclick="toggleCart()" class="fixed bottom-24 left-4 right-4 bg-red-600 text-white p-4 rounded-2xl flex justify-between items-center shadow-2xl z-40 hidden active:scale-95 transition-all">
        <div class="flex items-center gap-3">
            <span id="cart-count" class="bg-white text-red-600 px-2 rounded-lg font-black text-sm">0</span>
            <span class="font-bold">รายการอาหารในมือ</span>
        </div>
        <span id="cart-total" class="text-xl font-black italic">฿0</span>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-[2.5rem] h-[80vh] flex flex-col overflow-hidden">
            <div class="p-6 text-center border-b shrink-0 relative">
                <h3 class="text-xl font-black">ยืนยันการรับออเดอร์</h3>
                <button onclick="toggleCart()" class="absolute right-6 top-6 text-slate-300"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
            <div class="p-8 bg-slate-50 border-t space-y-4">
                <div class="flex justify-between items-end">
                    <span class="text-slate-400 font-bold uppercase text-xs tracking-widest">ยอดรวมทั้งหมด</span>
                    <span id="modal-total" class="text-4xl font-black text-red-600">฿0</span>
                </div>
                <button onclick="pushToQueue()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-all">
                    <i class="fas fa-paper-plane mr-2"></i>เปิดคิวใหม่
                </button>
            </div>
        </div>
    </div>

    <div id="payment-modal" class="fixed inset-0 bg-slate-900/95 z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-6 space-y-4 shadow-2xl">
            <div class="text-center">
                <p id="pay-label" class="text-slate-400 font-bold text-[10px] uppercase mb-1 tracking-widest"></p>
                <h2 id="pay-amount" class="text-5xl font-black italic text-red-600">฿0</h2>
            </div>

            <div class="space-y-2">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">ช่องทางสั่งซื้อ</p>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="selectChannel('หน้าร้าน')" class="channel-btn border-2 border-red-500 p-2 rounded-xl text-[10px] font-bold" id="chan-store">WALK-IN</button>
                    <button onclick="selectChannel('LINEMAN')" class="channel-btn border-2 border-slate-100 p-2 rounded-xl text-[10px] font-bold text-green-600" id="chan-lineman">LINEMAN</button>
                    <button onclick="selectChannel('GRAB')" class="channel-btn border-2 border-slate-100 p-2 rounded-xl text-[10px] font-bold text-green-700" id="chan-grab">GRAB</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="selectMethod('CASH')" class="method-btn border-2 border-slate-100 p-4 rounded-2xl flex flex-col items-center transition-all" id="meth-cash">
                    <i class="fas fa-money-bill-wave text-emerald-500 mb-1 text-xl"></i>
                    <span class="text-[10px] font-black uppercase">เงินสด</span>
                </button>
                <button onclick="selectMethod('TRANSFER')" class="method-btn border-2 border-slate-100 p-4 rounded-2xl flex flex-col items-center transition-all" id="meth-transfer">
                    <i class="fas fa-mobile-alt text-blue-500 mb-1 text-xl"></i>
                    <span class="text-[10px] font-black uppercase">เงินโอน</span>
                </button>
            </div>

            <div id="cash-box" class="hidden bg-slate-50 p-4 rounded-2xl space-y-3">
                <input type="number" id="cash-in" oninput="doChange()" inputmode="decimal" placeholder="รับเงินมา..." class="w-full text-3xl font-black text-center py-2 bg-transparent outline-none">
                <div class="flex justify-between font-bold text-sm border-t pt-2 border-slate-200">
                    <span class="text-slate-400 uppercase">เงินทอน</span>
                    <span id="change-text" class="text-emerald-500">฿0</span>
                </div>
            </div>

            <button id="btn-final" onclick="processPayment()" class="w-full bg-slate-300 text-white py-5 rounded-2xl font-black text-xl shadow-lg transition-all" disabled>บันทึกการขาย & พิมพ์</button>
            <button onclick="closePayment()" class="w-full text-slate-400 font-bold text-[10px] uppercase tracking-widest">ยกเลิกรายการนี้</button>
        </div>
    </div>

    <div id="receipt-print" class="hidden" style="width: 58mm; padding: 5px; color: black; background: white;">
        <div style="text-align: center;">
            <h2 style="font-size: 16px; font-weight: 800; margin: 0;">AMAMEE PIZZA</h2>
            <p style="font-size: 10px; margin: 2px 0;">ฮาลาล 100% สดใหม่ทุกถาด</p>
        </div>
        <div style="border-top: 1px dashed black; margin: 8px 0;"></div>
        <div id="receipt-details" style="font-size: 11px; line-height: 1.4;"></div>
        <div style="border-top: 1px dashed black; margin: 8px 0;"></div>
        <div style="text-align: center; font-size: 10px; margin-top: 10px;">
            ขอบคุณที่อุดหนุนค่ะ ❤️<br>
            สั่งจอง: 092-803-6695
        </div>
    </div>

<script>
    // --- SETTINGS ---
    const API = 'https://script.google.com/macros/s/AKfycbxOP-PzsvYATCXPpnhh0cKyAPJCFHojlLI36XSPB4YoC-l0vIU23D9X4XCrlwyHPBE7PA/exec'; 

    let cart = [];
    let queue = JSON.parse(localStorage.getItem('amamee_local_queue')) || [];
    let queueCounter = parseInt(localStorage.getItem('amamee_q_counter')) || 1;
    let currentOrder = null;
    let currentPayMethod = null;
    let currentChannel = 'หน้าร้าน';

    const menu = [
        { id: 'H01', name: 'ฮาวายเอี้ยน', price: 59, icon: '🍍' },
        { id: 'H02', name: 'แฮมชีส', price: 59, icon: '🍖' },
        { id: 'H03', name: 'แฮมปูอัดชีส', price: 59, icon: '🦀' },
        { id: 'H04', name: 'ไก่กรอบชีส', price: 59, icon: '🍗' },
        { id: 'H05', name: 'ข้าวโพดอบชีส', price: 59, icon: '🌽' },
        { id: 'H06', name: 'ฮอตดอกชีส', price: 59, icon: '🌭' },
        { id: 'H07', name: 'ชีสเลิฟเวอร์', price: 69, icon: '🧀' },
        { id: 'H08', name: 'ซีฟู้ด', price: 69, icon: '🍤' },
        { id: 'H09', name: 'ผักโขมชีส', price: 69, icon: '🌿' },
        { id: 'H10', name: 'หน้ารวม', price: 79, icon: '🍕' },
        { id: 'S01', name: 'เพิ่มชีส', price: 20, icon: '🧀' },
        { id: 'R01', name: 'โรตีธรรมดา', price: 10, icon: '🫓' },
        { id: 'R02', name: 'โรตีใส่ไข่', price: 20, icon: '🍳' },
        { id: 'R03', name: 'มะตะบะกล้วย', price: 30, icon: '🍌' },
        { id: 'R04', name: 'มะตะบะไก่', price: 30, icon: '🐔' },
        { id: 'R05', name: 'มะตะบะเนื้อ', price: 30, icon: '🥩' }
    ];

    // --- NAVIGATION ---
    function switchView(id) {
        ['pos', 'queue', 'history'].forEach(v => {
            document.getElementById('view-'+v).classList.add('hidden');
            document.getElementById('btn-'+v).classList.remove('active-tab');
        });
        document.getElementById('view-'+id).classList.remove('hidden');
        document.getElementById('btn-'+id).classList.add('active-tab');
        if(id === 'queue') renderQueue();
        if(id === 'history') syncHistory();
    }

    // --- POS ENGINE ---
    function initMenu() {
        document.getElementById('menu-grid').innerHTML = menu.map(p => `
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-50 text-center active:scale-95 transition-all" onclick="addToCart('${p.id}')">
                <div class="text-4xl mb-2">${p.icon}</div>
                <div class="font-extrabold text-xs text-slate-700">${p.name}</div>
                <div class="text-red-500 font-black text-sm">฿${p.price}</div>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const p = menu.find(x => x.id === id);
        const item = cart.find(x => x.id === id);
        if(item) item.qty++; else cart.push({...p, qty: 1});
        updateCartUI();
    }

    function updateCartUI() {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const count = cart.reduce((s, i) => s + i.qty, 0);
        document.getElementById('cart-preview').classList.toggle('hidden', cart.length === 0);
        document.getElementById('cart-count').innerText = count;
        document.getElementById('cart-total').innerText = `฿${total}`;
        document.getElementById('modal-total').innerText = `฿${total}`;
        document.getElementById('cart-items').innerHTML = cart.map(i => `
            <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl">
                <div><p class="font-black text-sm">${i.name}</p><p class="text-[10px] text-slate-400 font-bold">฿${i.price}</p></div>
                <div class="flex items-center gap-4">
                    <button onclick="changeQty('${i.id}', -1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-black text-red-500">-</button>
                    <span class="font-black text-lg">${i.qty}</span>
                    <button onclick="changeQty('${i.id}', 1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-black text-blue-500">+</button>
                </div>
            </div>
        `).join('');
    }

    function changeQty(id, d) {
        const item = cart.find(x => x.id === id);
        if(item) {
            item.qty += d;
            if(item.qty <= 0) cart = cart.filter(x => x.id !== id);
            updateCartUI();
        }
    }

    function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }

    // --- QUEUE SYSTEM ---
    async function pushToQueue() {
        if (cart.length === 0) return;
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        
        const order = {
            uid: Date.now(),
            q_no: queueCounter,
            date: now.toLocaleDateString('th-TH'),
            time: timeStr,
            summary: cart.map(i => `${i.name}x${i.qty}`).join(', '),
            total: cart.reduce((s, i) => s + (i.price * i.qty), 0),
            status: 'รอดำเนินการ'
        };

        // Backend Sync
        const params = new URLSearchParams({
            action: 'saveQueue',
            date: order.date,
            time: order.time,
            items: `(คิว ${order.q_no}) ${order.summary}`,
            total: order.total
        });
        fetch(`${API}?${params.toString()}`, { mode: 'no-cors' });

        queue.push(order);
        queueCounter++;
        localStorage.setItem('amamee_q_counter', queueCounter);
        saveQueueLocal();
        cart = [];
        updateCartUI();
        toggleCart();
        switchView('queue');
    }

    function saveQueueLocal() {
        localStorage.setItem('amamee_local_queue', JSON.stringify(queue));
        renderQueue();
    }

    function renderQueue() {
        const badge = document.getElementById('badge-queue');
        badge.innerText = queue.length;
        badge.classList.toggle('hidden', queue.length === 0);
        document.getElementById('queue-count-text').innerText = `${queue.length} รายการค้าง`;

        document.getElementById('queue-list').innerHTML = queue.map(q => `
            <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-50 space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">${q.time}</p>
                        <h3 class="text-2xl font-black text-slate-800 italic">#${q.q_no}</h3>
                    </div>
                    <div class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${q.status === 'กำลังปรุง' ? 'bg-orange-100 text-orange-600 blink' : 'bg-red-50 text-red-600'}">
                        ${q.status}
                    </div>
                </div>
                <p class="text-slate-600 font-bold text-sm leading-snug">${q.summary}</p>
                <div class="flex gap-2 pt-2">
                    <button onclick="cancelOrder(${q.uid})" class="flex-1 bg-slate-50 text-slate-400 py-3 rounded-xl font-bold text-xs uppercase">ยกเลิก</button>
                    <button onclick="changeStatus(${q.uid}, 'กำลังปรุง')" class="flex-1 bg-orange-100 text-orange-600 py-3 rounded-xl font-bold text-xs uppercase">เริ่มปรุง</button>
                    <button onclick="openPay(${q.uid})" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-md">เสร็จแล้ว</button>
                </div>
            </div>
        `).join('');
    }

    async function changeStatus(uid, status) {
        const order = queue.find(q => q.uid == uid);
        if(order) {
            order.status = status;
            saveQueueLocal();
            const params = new URLSearchParams({ action: 'updateStatus', time: order.time, status: status });
            fetch(`${API}?${params.toString()}`, { mode: 'no-cors' });
        }
    }

    async function cancelOrder(uid) {
        if (!confirm('ยกเลิกรายการนี้?')) return;
        const order = queue.find(q => q.uid === uid);
        if (order) {
            const params = new URLSearchParams({ action: 'updateStatus', time: order.time, status: 'ยกเลิกรายการ' });
            fetch(`${API}?${params.toString()}`, { mode: 'no-cors' });
            queue = queue.filter(q => q.uid !== uid);
            saveQueueLocal();
        }
    }

    // --- PAYMENT & RECEIPT ---
    function openPay(uid) {
        const order = queue.find(q => q.uid === uid);
        if(!order) return;
        currentOrder = order;
        document.getElementById('pay-label').innerText = `คิวที่ ${order.q_no} • ยอดชำระเงิน`;
        document.getElementById('pay-amount').innerText = `฿${order.total}`;
        document.getElementById('payment-modal').classList.remove('hidden');
        selectChannel('หน้าร้าน');
    }

    function selectChannel(chan) {
        currentChannel = chan;
        document.querySelectorAll('.channel-btn').forEach(b => b.classList.replace('border-red-500', 'border-slate-100'));
        if(chan === 'หน้าร้าน') document.getElementById('chan-store').classList.replace('border-slate-100', 'border-red-500');
        else if(chan === 'LINEMAN') document.getElementById('chan-lineman').classList.replace('border-slate-100', 'border-red-500');
        else document.getElementById('chan-grab').classList.replace('border-slate-100', 'border-red-500');
    }

    function selectMethod(method) {
        currentPayMethod = method === 'CASH' ? 'เงินสด' : 'เงินโอน';
        document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('border-red-500'));
        if(method === 'CASH') document.getElementById('meth-cash').classList.add('border-red-500');
        else document.getElementById('meth-transfer').classList.add('border-red-500');
        document.getElementById('cash-box').classList.toggle('hidden', method !== 'CASH');
        doChange();
    }

    function doChange() {
        const cashIn = parseFloat(document.getElementById('cash-in').value) || 0;
        const diff = cashIn - currentOrder.total;
        document.getElementById('change-text').innerText = `฿${diff >= 0 ? diff : 0}`;
        const btn = document.getElementById('btn-final');
        if (currentPayMethod === 'เงินโอน' || (currentPayMethod === 'เงินสด' && cashIn >= currentOrder.total)) {
            btn.disabled = false;
            btn.classList.replace('bg-slate-300', 'bg-red-600');
        } else {
            btn.disabled = true;
            btn.classList.replace('bg-red-600', 'bg-slate-300');
        }
    }

    async function processPayment() {
        const btn = document.getElementById('btn-final');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>บันทึก...';

        // Receipt Formatting
        const items = currentOrder.summary.split(',').map(i => {
            const parts = i.trim().split('x');
            return `<div style="display:flex; justify-content:space-between;"><span>${parts[0]}</span><span>x${parts[1]}</span></div>`;
        }).join('');

        document.getElementById('receipt-details').innerHTML = `
            <div style="text-align:center; font-weight:800; font-size:14px; margin-bottom:5px;">คิวที่: ${currentOrder.q_no}</div>
            <div style="margin-bottom:5px;">เวลา: ${currentOrder.time} | ช่องทาง: ${currentChannel}</div>
            <div style="margin:8px 0;">${items}</div>
            <div style="display:flex; justify-content:space-between; font-weight:800; border-top:1px dashed black; padding-top:5px;">
                <span>รวมทั้งสิ้น:</span><span>฿${currentOrder.total}</span>
            </div>
            <div style="font-size:9px; color:#555; margin-top:5px;">ชำระโดย: ${currentPayMethod}</div>
        `;

        const params = new URLSearchParams({ 
            action: 'saveSale', 
            time: currentOrder.time, 
            method: `${currentChannel} (${currentPayMethod})`
        });

        try {
            fetch(`${API}?${params.toString()}`, { mode: 'no-cors' });
            window.print();
            queue = queue.filter(q => q.uid !== currentOrder.uid);
            saveQueueLocal();
            closePayment();
            switchView('history');
        } catch (e) {
            alert('Error!');
        }
    }

    function closePayment() { 
        document.getElementById('payment-modal').classList.add('hidden'); 
        document.getElementById('cash-in').value = '';
        currentPayMethod = null;
    }

    // --- HISTORY ENGINE ---
    function syncHistory() {
        const container = document.getElementById('history-list');
        container.innerHTML = '<div class="text-center py-20 text-slate-300"><i class="fas fa-spinner fa-spin text-3xl mb-3"></i><p class="font-bold">กำลังอัปเดต...</p></div>';
        const s = document.createElement('script');
        s.src = `${API}?action=getFinanceDetail&callback=renderHistory&t=${Date.now()}`;
        document.body.appendChild(s);
    }

    window.renderHistory = function(data) {
        const container = document.getElementById('history-list');
        if (!data.details || data.details.length === 0) {
            container.innerHTML = `<div class="text-center py-20 text-slate-300 font-black">ยังไม่มีประวัติการขาย</div>`;
            return;
        }
        container.innerHTML = data.details.map(item => `
            <div class="bg-white p-4 rounded-3xl shadow-sm mb-3 border border-slate-50">
                <div class="flex justify-between items-start mb-1">
                    <span class="text-[9px] font-black text-blue-500 bg-blue-50 px-2 py-0.5 rounded-full uppercase">${item.date}</span>
                    <span class="font-black text-slate-800 italic text-lg">฿${item.total.toLocaleString()}</span>
                </div>
                <p class="text-xs font-bold text-slate-700 leading-tight">${item.items}</p>
                <div class="flex justify-between mt-2 text-[9px] text-slate-400 font-black uppercase border-t pt-2 border-slate-50">
                    <span><i class="far fa-clock mr-1"></i>${item.time}</span>
                    <span class="text-emerald-500 font-black">${item.method}</span>
                </div>
            </div>
        `).join('');
    };

    function resetAllQueues() {
        if(confirm('รีเซ็ตเลขคิวเป็น Q1?')) {
            queue = []; queueCounter = 1;
            localStorage.setItem('amamee_q_counter', 1);
            saveQueueLocal();
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }

    window.onload = () => { initMenu(); renderQueue(); };
</script>
</body>
</html>
