<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAMEE Manager Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #F8FAFC; }
        .tab-active { color: #EF4444; border-bottom: 3px solid #EF4444; }
        .list-text-xs { font-size: 0.65rem; line-height: 1rem; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-[#0F172A] text-white p-6 rounded-b-[2.5rem] shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black italic uppercase tracking-tighter">AMAMEE <span class="text-red-500">Insight</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Financial Controller</p>
            </div>
            <button onclick="refreshData()" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center border border-white/20 active:rotate-180 transition-all">
                <i class="fas fa-sync-alt text-sm"></i>
            </button>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                <p class="text-[10px] text-slate-400 font-bold uppercase">วันนี้ (พ.ศ.)</p>
                <h2 id="display-date" class="text-sm font-black text-white italic italic italic italic italic italic">กำลังโหลด...</h2>
            </div>
            <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-right">
                <p class="text-[10px] text-slate-400 font-bold uppercase">กำไรวันนี้ (30%)</p>
                <h2 id="today-profit-top" class="text-xl font-black text-green-400">฿0</h2>
            </div>
        </div>
    </header>

    <nav class="flex justify-around bg-white border-b sticky top-0 z-40">
        <button onclick="switchView('dash')" id="tab-dash" class="tab-active py-4 px-4 font-black text-[10px] uppercase">Dashboard</button>
        <button onclick="switchView('details')" id="tab-details" class="py-4 px-4 font-black text-[10px] uppercase text-slate-400">Transactions</button>
        <button onclick="switchView('exp')" id="tab-exp" class="py-4 px-4 font-black text-[10px] uppercase text-slate-400">Expense</button>
        <button onclick="switchView('stock')" id="tab-stock" class="py-4 px-4 font-black text-[10px] uppercase text-slate-400">Stock</button>
    </nav>

    <div id="view-dash" class="p-4 space-y-6">
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <h3 class="font-black text-slate-800 mb-6 flex items-center gap-2 italic">
                <i class="fas fa-chart-pie text-red-500"></i> สรุปรายเดือนนี้
            </h3>
            <div class="space-y-5">
                <div class="flex justify-between items-end">
                    <span class="text-slate-500 font-bold text-sm italic">ยอดขายรวม (Gross)</span>
                    <span id="month-income" class="font-black text-3xl text-slate-800 tracking-tighter">฿0</span>
                </div>
                <div class="grid grid-cols-2 gap-4 py-4 border-y border-dashed border-slate-200">
                    <div class="bg-blue-50/50 p-3 rounded-2xl">
                        <p class="text-[10px] text-blue-600 font-black uppercase">ทุน (70%)</p>
                        <p id="month-cap" class="font-black text-slate-700">฿0</p>
                    </div>
                    <div class="bg-green-50/50 p-3 rounded-2xl">
                        <p class="text-[10px] text-green-600 font-black uppercase">กำไร (30%)</p>
                        <p id="month-prof" class="font-black text-slate-700">฿0</p>
                    </div>
                </div>
                <div class="bg-slate-900 p-5 rounded-3xl text-white space-y-3">
                    <div class="flex justify-between items-center text-red-400">
                        <span class="text-xs font-bold uppercase">รายจ่ายจริงที่หักไป</span>
                        <span id="month-exp" class="font-black">-฿0</span>
                    </div>
                    <div class="h-px bg-white/10 w-full"></div>
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-black text-slate-400 uppercase tracking-widest">เงินทุนคงเหลือสุทธิ</span>
                        <span id="remain-cap" class="text-2xl font-black text-blue-400 tracking-tighter">฿0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="view-details" class="hidden p-4 space-y-4">
        <div class="flex bg-slate-200 p-1 rounded-2xl">
            <button onclick="setDetailMode('inc')" id="btn-m-inc" class="flex-1 py-2 rounded-xl text-[10px] font-black uppercase">Income Only</button>
            <button onclick="setDetailMode('both')" id="btn-m-both" class="flex-1 py-2 rounded-xl text-[10px] font-black uppercase bg-white shadow-sm">Split View</button>
            <button onclick="setDetailMode('exp')" id="btn-m-exp" class="flex-1 py-2 rounded-xl text-[10px] font-black uppercase">Expense Only</button>
        </div>
        <div id="split-container" class="grid grid-cols-2 gap-3">
            <div id="col-income" class="space-y-2">
                <h4 class="text-[10px] font-black text-green-600 uppercase px-2 italic">Income Today</h4>
                <div id="income-list" class="space-y-2"></div>
            </div>
            <div id="col-expense" class="space-y-2 border-l pl-2 border-slate-200">
                <h4 class="text-[10px] font-black text-red-600 uppercase px-2 italic">Expense Month</h4>
                <div id="expense-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <div id="view-exp" class="hidden p-4">
        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl">
            <h3 class="font-black text-slate-800 mb-4 flex items-center gap-2 italic">
                <i class="fas fa-plus-circle text-red-500"></i> บันทึกค่าใช้จ่าย
            </h3>
            <div class="space-y-3">
                <input type="text" id="exp-desc" placeholder="รายการจ่าย" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                <input type="number" id="exp-amount" placeholder="จำนวนเงิน" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-black text-2xl">
                <button onclick="saveExp()" id="btn-save-exp" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black">บันทึก</button>
            </div>
        </div>
    </div>

    <div id="view-stock" class="hidden p-4 space-y-4">
        <button onclick="openStockModal('', 0, 0, '')" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-black text-sm shadow-lg">
            <i class="fas fa-plus mr-2"></i> เพิ่มสินค้าใหม่
        </button>
        <div id="full-stock-list" class="space-y-3"></div>
    </div>

    <div id="stock-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
        <div class="bg-white w-full rounded-[2.5rem] p-6 space-y-3">
            <h3 class="font-black italic uppercase text-slate-800">จัดการสต๊อก</h3>
            <input type="text" id="s-name" placeholder="ชื่อสินค้า" class="w-full p-3 bg-slate-100 rounded-xl font-bold">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="s-qty" placeholder="จำนวนคงเหลือ" class="p-3 bg-slate-100 rounded-xl font-bold">
                <input type="number" id="s-min" placeholder="ขั้นต่ำแจ้งเตือน" class="p-3 bg-slate-100 rounded-xl font-bold">
            </div>
            <input type="text" id="s-unit" placeholder="หน่วย (ก้อน, กิโล, ถุง)" class="w-full p-3 bg-slate-100 rounded-xl font-bold">
            <div class="flex gap-2 pt-2">
                <button onclick="deleteStockItem()" id="btn-del-stock" class="hidden flex-1 py-3 text-red-500 font-bold">ลบ</button>
                <button onclick="closeStockModal()" class="flex-1 py-3 font-bold text-slate-400">ปิด</button>
                <button onclick="saveStock()" id="btn-save-stock" class="flex-[2] bg-slate-900 text-white py-3 rounded-xl font-black">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbz1ZUjRiqKtuKOyWibj5UZLQ3JeHwkIDOm9z8XZFuthMeMHZqxYqMmFtP41xHC1tolT9g/exec";

        function switchView(v) {
            ['dash','details','exp','stock'].forEach(i => {
                document.getElementById('view-'+i).classList.add('hidden');
                document.getElementById('tab-'+i).classList.remove('tab-active');
                document.getElementById('tab-'+i).classList.add('text-slate-400');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('tab-'+v).classList.add('tab-active');
            document.getElementById('tab-'+v).classList.remove('text-slate-400');
            if(v === 'stock') loadStock();
        }

        function setDetailMode(mode) {
            const container = document.getElementById('split-container');
            const colInc = document.getElementById('col-income');
            const colExp = document.getElementById('col-expense');
            ['inc','both','exp'].forEach(m => document.getElementById('btn-m-'+m).classList.remove('bg-white','shadow-sm'));
            document.getElementById('btn-m-'+mode).classList.add('bg-white','shadow-sm');

            if(mode === 'both') {
                container.className = "grid grid-cols-2 gap-3";
                colInc.classList.remove('hidden'); colExp.classList.remove('hidden');
            } else if(mode === 'inc') {
                container.className = "grid grid-cols-1";
                colInc.classList.remove('hidden'); colExp.classList.add('hidden');
            } else {
                container.className = "grid grid-cols-1";
                colInc.classList.add('hidden'); colExp.classList.remove('hidden');
            }
        }

        function refreshData() {
            const now = new Date();
            document.getElementById('display-date').innerText = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()+543}`;
            const s = document.createElement('script');
            s.src = `${API}?action=getFinanceDetail&callback=renderAll&t=${Date.now()}`;
            document.body.appendChild(s);
            loadStock();
        }

        window.renderAll = function(d) {
            // Dashboard
            document.getElementById('today-profit-top').innerText = `฿${(d.summary.todayIncome * 0.3).toLocaleString()}`;
            document.getElementById('month-income').innerText = `฿${d.summary.monthIncome.toLocaleString()}`;
            const cap = d.summary.monthIncome * 0.7;
            document.getElementById('month-cap').innerText = `฿${cap.toLocaleString()}`;
            document.getElementById('month-prof').innerText = `฿${(d.summary.monthIncome * 0.3).toLocaleString()}`;
            document.getElementById('month-exp').innerText = `-฿${d.summary.monthExpense.toLocaleString()}`;
            document.getElementById('remain-cap').innerText = `฿${(cap - d.summary.monthExpense).toLocaleString()}`;

            // Income List
            document.getElementById('income-list').innerHTML = d.details.incomes.map(i => `
                <div class="bg-white p-2 rounded-xl shadow-sm border-l-2 border-green-500">
                    <p class="font-black text-slate-800 list-text-xs">฿${parseFloat(i.total).toLocaleString()}</p>
                    <p class="text-[8px] text-slate-400 truncate font-bold">${i.time} | ${i.items}</p>
                </div>
            `).join('') || '<p class="text-[8px] text-center text-slate-400">ไม่มีข้อมูล</p>';

            // Expense List
            document.getElementById('expense-list').innerHTML = d.details.expenses.map(e => `
                <div class="bg-white p-2 rounded-xl shadow-sm border-l-2 border-red-500">
                    <p class="font-black text-red-600 list-text-xs">฿${parseFloat(e.amount).toLocaleString()}</p>
                    <p class="text-[8px] text-slate-400 font-bold">${e.date} | ${e.desc}</p>
                </div>
            `).join('') || '<p class="text-[8px] text-center text-slate-400">ไม่มีข้อมูล</p>';
        }

        function loadStock() {
            const s = document.createElement('script');
            s.src = `${API}?action=getAllInventory&callback=renderStock&t=${Date.now()}`;
            document.body.appendChild(s);
        }

        window.renderStock = function(items) {
            document.getElementById('full-stock-list').innerHTML = items.map(i => {
                const isLow = parseFloat(i.stock) <= parseFloat(i.min);
                return `
                    <div class="bg-white p-4 rounded-[2rem] shadow-sm border-2 ${isLow ? 'border-red-200 bg-red-50/50' : 'border-transparent'} flex justify-between items-center">
                        <div>
                            <p class="font-black text-slate-800 text-sm">${i.item}</p>
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Min: ${i.min} ${i.unit}</p>
                        </div>
                        <div class="flex items-center gap-3 text-right">
                            <div>
                                <p class="text-xl font-black ${isLow ? 'text-red-600' : 'text-slate-800'}">${i.stock}</p>
                                <p class="text-[8px] font-bold text-slate-400 uppercase">${i.unit}</p>
                            </div>
                            <button onclick="openStockModal('${i.item}', ${i.stock}, ${i.min}, '${i.unit}')" class="w-8 h-8 bg-slate-100 rounded-lg flex items-center justify-center text-slate-500">
                                <i class="fas fa-edit text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('') || '<p class="text-center text-slate-400 py-10">ยังไม่มีสินค้าในสต๊อก</p>';
        }

        function openStockModal(name, qty, min, unit) {
            document.getElementById('s-name').value = name;
            document.getElementById('s-qty').value = qty;
            document.getElementById('s-min').value = min;
            document.getElementById('s-unit').value = unit;
            document.getElementById('btn-del-stock').classList.toggle('hidden', name === '');
            document.getElementById('stock-modal').classList.remove('hidden');
        }

        function closeStockModal() { document.getElementById('stock-modal').classList.add('hidden'); }

        async function saveStock() {
            const btn = document.getElementById('btn-save-stock');
            btn.innerText = "กำลังบันทึก...";
            const n = document.getElementById('s-name').value;
            const q = document.getElementById('s-qty').value;
            const m = document.getElementById('s-min').value;
            const u = document.getElementById('s-unit').value;
            await fetch(`${API}?action=saveStock&item=${n}&qty=${q}&min=${m}&unit=${u}`, {mode:'no-cors'});
            btn.innerText = "บันทึก";
            closeStockModal();
            refreshData();
        }

        async function deleteStockItem() {
            if(!confirm('ยืนยันการลบ?')) return;
            const n = document.getElementById('s-name').value;
            await fetch(`${API}?action=deleteStock&item=${n}`, {mode:'no-cors'});
            closeStockModal();
            refreshData();
        }

        async function saveExp() {
            const desc = document.getElementById('exp-desc').value;
            const amt = document.getElementById('exp-amount').value;
            if(!desc || !amt) return alert('กรุณาระบุข้อมูลให้ครบ');
            document.getElementById('btn-save-exp').innerText = "กำลังบันทึก...";
            await fetch(`${API}?action=saveExpense&desc=${desc}&amount=${amt}`, {mode:'no-cors'});
            alert('บันทึกเรียบร้อย');
            document.getElementById('exp-desc').value = '';
            document.getElementById('exp-amount').value = '';
            document.getElementById('btn-save-exp').innerText = "บันทึก";
            refreshData();
            switchView('dash');
        }

        window.onload = refreshData;
    </script>
</body>
</html>
