<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AMAMEE INSIGHT - Full System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #0f172a; color: white; }
        .page { display: none; min-height: 100vh; }
        .page.active { display: block; }
        .tab-active { color: #ef4444; border-bottom: 2px solid #ef4444; }
    </style>
</head>
<body>

    <header class="p-6 flex justify-between items-center">
        <h1 class="text-2xl font-black italic">AMAMEE <span class="text-red-500">INSIGHT</span></h1>
        <button onclick="fetchAllData()"><span class="material-symbols-outlined">refresh</span></button>
    </header>

    <div class="flex justify-between px-6 border-b border-slate-800 text-[10px] font-bold uppercase mb-6">
        <button onclick="nav('dashboard')" id="t-dashboard" class="pb-2 tab-active">Dashboard</button>
        <button onclick="nav('income')" id="t-income" class="pb-2 text-slate-500">Add Income</button>
        <button onclick="nav('expense')" id="t-expense" class="pb-2 text-slate-500">Add Expense</button>
        <button onclick="nav('stock')" id="t-stock" class="pb-2 text-slate-500">Stock</button>
    </div>

    <main id="p-dashboard" class="page active px-6">
        <div class="bg-white rounded-[30px] p-6 text-slate-900 shadow-xl mb-6">
            <h2 class="text-center text-[10px] font-bold uppercase text-slate-400 mb-1">ยอดขายสุทธิวันนี้</h2>
            <h1 id="dash-sales" class="text-5xl font-black italic text-center mb-6">฿0</h1>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-50 p-4 rounded-2xl text-center">
                    <p class="text-[9px] text-blue-500 font-bold uppercase">เงินทุน (70%)</p>
                    <p id="dash-cap" class="text-xl font-black italic">0</p>
                </div>
                <div class="bg-green-50 p-4 rounded-2xl text-center">
                    <p class="text-[9px] text-green-500 font-bold uppercase">กำไร (30%)</p>
                    <p id="dash-prof" class="text-xl font-black italic">0</p>
                </div>
            </div>
        </div>
        <h3 class="font-bold mb-4 italic text-sm text-slate-400">Transaction History</h3>
        <div id="log-list" class="space-y-2"></div>
    </main>

    <main id="p-income" class="page px-6">
        <div class="bg-slate-800 p-6 rounded-3xl">
            <h2 class="font-bold mb-4 italic">บันทึกรายรับ (ยอดขาย)</h2>
            <input type="number" id="in-amt" class="w-full bg-slate-700 p-4 rounded-xl text-2xl font-bold mb-4" placeholder="0.00">
            <select id="in-method" class="w-full bg-slate-700 p-4 rounded-xl mb-4">
                <option value="เงินโอน">เงินโอน</option>
                <option value="เงินสด">เงินสด</option>
            </select>
            <button onclick="saveIncome()" class="w-full bg-blue-600 p-4 rounded-xl font-black italic">SAVE INCOME</button>
        </div>
    </main>

    <main id="p-expense" class="page px-6">
        <div class="bg-slate-800 p-6 rounded-3xl">
            <h2 class="font-bold mb-4 italic">บันทึกรายจ่าย (หักจากทุน)</h2>
            <input type="number" id="ex-amt" class="w-full bg-slate-700 p-4 rounded-xl text-2xl font-bold mb-4" placeholder="0.00">
            <input type="text" id="ex-title" class="w-full bg-slate-700 p-4 rounded-xl mb-4" placeholder="ระบุรายการ (เช่น ค่าเช่าที่)">
            <button onclick="saveExpense()" class="w-full bg-red-600 p-4 rounded-xl font-black italic">SAVE EXPENSE</button>
        </div>
    </main>

    <main id="p-stock" class="page px-6">
        <div class="bg-slate-800 p-6 rounded-3xl mb-6">
            <h2 class="font-bold mb-4 italic">เพิ่มสินค้าเข้าคลัง (หักทุน)</h2>
            <input type="text" id="st-name" class="w-full bg-slate-700 p-3 rounded-xl mb-2" placeholder="ชื่อสินค้า">
            <div class="flex gap-2 mb-4">
                <input type="number" id="st-qty" class="flex-1 bg-slate-700 p-3 rounded-xl" placeholder="จำนวน">
                <input type="number" id="st-cost" class="flex-1 bg-slate-700 p-3 rounded-xl" placeholder="ทุน/หน่วย">
            </div>
            <button onclick="saveStock()" class="w-full bg-emerald-600 p-4 rounded-xl font-black italic">ADD TO STOCK</button>
        </div>
        <div id="stock-list" class="space-y-2"></div>
    </main>

    <script>
        const SB_URL = 'https://fhedgbohznryyytgkbcu.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZWRnYm9oem5yeXl5dGdrYmN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MjA3NTUsImV4cCI6MjA4ODA5Njc1NX0.Y9V3lP2p2bpf_4P1g1T3EFt_0HuhEkhPgzGhS71EghE';
        const sb = supabase.createClient(SB_URL, SB_KEY, {
          global: {
            headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
          }
        });
                
        console.log("URL:", SB_URL);
        console.log("Key Length:", SB_KEY.length); // โดยปกติ anon key จะยาวประมาณ 100+ ตัวอักษร
                
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('div button').forEach(b => b.classList.remove('tab-active', 'text-slate-500'));
            document.getElementById('p-'+id).classList.add('active');
            document.getElementById('t-'+id).classList.add('tab-active');
            if(id === 'dashboard') fetchAllData();
            if(id === 'stock') fetchStock();
        }

        async function saveIncome() {
            // ตัวอย่าง Logic การบันทึกที่สอดคล้องกับรูปภาพของคุณ
            const amt = parseFloat(document.getElementById('in-amt').value);
            const capital = amt * 0.7; // เงินทุน 70%
            const profit = amt * 0.3;  // กำไร 30%
            
            // ส่งไปที่ตาราง transactions
            const { error } = await sb.from('transactions').insert([{
                type: 'income',
                amount: amt,
                capital: capital,
                profit: profit,
                title: 'ยอดขายรายวัน'
            }]);
        
            if (response.ok) {
                alert("บันทึกสำเร็จ!");
                nav('dashboard');
            } else {
                const errData = await response.json();
                console.error("Error Detail:", errData);
                alert("พังเพราะ: " + (errData.message || response.statusText));
            }
        }
        async function saveExpense() {
            const amt = parseFloat(document.getElementById('ex-amt').value);
            const title = document.getElementById('ex-title').value;
            if(!amt || !title) return alert("กรอกข้อมูลให้ครบ");

            // รายจ่ายจะติดลบในส่วนของทุน (Capital) และไม่มีกำไร (Profit = 0)
            const { error } = await sb.from('transactions').insert([{
                type: 'expense', amount: amt, capital: -amt, profit: 0, payment_method: 'เงินสด', title: title
            }]);
            if(!error) { alert("บันทึกรายจ่ายแล้ว"); document.getElementById('ex-amt').value = ''; nav('dashboard'); }
        }

        async function saveStock() {
            const name = document.getElementById('st-name').value;
            const qty = parseInt(document.getElementById('st-qty').value);
            const cost = parseFloat(document.getElementById('st-cost').value);
            if(!name || !qty) return alert("กรอกข้อมูลให้ครบ");

            const totalCost = qty * cost;
            // 1. บันทึกเข้าตาราง Stock
            await sb.from('stock').insert([{ item_name: name, quantity: qty, cost_per_unit: cost }]);
            // 2. บันทึกรายจ่ายเพื่อหักทุนสะสม
            await sb.from('transactions').insert([{
                type: 'expense', amount: totalCost, capital: -totalCost, profit: 0, title: 'ซื้อสต็อก: '+name
            }]);
            
            alert("บันทึกสต็อกและหักทุนแล้ว");
            nav('stock');
        }

        async function fetchAllData() {
            console.log("เริ่มดึงข้อมูล...");
            
            // ดึงทุกอย่างจากตาราง transactions
            const { data, error } = await sb
                .from('transactions')
                .select('*'); 
        
            if (error) {
                console.error("เกิดข้อผิดพลาด:", error.message);
                return;
            }
        
            console.log("ข้อมูลดิบจากฐานข้อมูล:", data);
        
            if (data && data.length > 0) {
                let totalSales = 0;
                let totalCapital = 0;
                let totalProfit = 0;
        
                data.forEach(item => {
                    // ใช้ชื่อคอลัมน์ให้ตรงกับใน Supabase (ตัวเล็กทั้งหมด)
                    totalSales += (item.amount || 0);
                    totalCapital += (item.capital || 0);
                    totalProfit += (item.profit || 0);
                });
        
                // อัปเดตตัวเลขบนหน้าจอ
                document.getElementById('dash-sales').innerText = '฿' + totalSales.toLocaleString();
                document.getElementById('dash-cap').innerText = '฿' + totalCapital.toLocaleString();
                document.getElementById('dash-prof').innerText = '฿' + totalProfit.toLocaleString();
            } else {
                console.warn("ดึงข้อมูลสำเร็จ แต่ไม่มีข้อมูลในตาราง (Array ว่าง)");
            }
        }

        async function fetchStock() {
            const { data } = await sb.from('stock').select('*');
            if(data) {
                document.getElementById('stock-list').innerHTML = data.map(i => `
                    <div class="bg-slate-800 p-4 rounded-xl flex justify-between italic">
                        <span class="font-bold">${i.item_name}</span>
                        <span class="text-blue-400">${i.quantity} หน่วย</span>
                    </div>
                `).join('');
            }
        }

        window.onload = fetchAllData;
    </script>
</body>
</html>
