<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAMEE Manager Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #F8FAFC; }
        .tab-active { color: #EF4444; border-bottom: 3px solid #EF4444; }
        @media (min-width: 640px) { body { max-width: 450px; margin: 0 auto; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; min-height: 100vh; } }
    </style>
</head>
<body class="pb-24">

    <header class="bg-[#0F172A] text-white p-6 rounded-b-[2.5rem] shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black italic uppercase tracking-tighter">AMAMEE <span class="text-red-500">Insight</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Financial Controller</p>
            </div>
            <button onclick="refreshData()" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center border border-white/20 active:scale-90">
                <i class="fas fa-sync-alt text-sm"></i>
            </button>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                <p class="text-[10px] text-slate-400 font-bold uppercase">วันนี้</p>
                <h2 id="display-date" class="text-sm font-black text-white italic">...</h2>
            </div>
            <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-right">
                <p class="text-[10px] text-slate-400 font-bold uppercase">กำไรวันนี้ (30%)</p>
                <h2 id="today-profit-top" class="text-xl font-black text-green-400">฿0</h2>
            </div>
        </div>
    </header>

    <nav class="flex justify-around bg-white border-b sticky top-0 z-40">
        <button onclick="switchView('dash')" id="tab-dash" class="tab-active py-4 px-4 font-black text-[10px] uppercase">Dashboard</button>
        <button onclick="switchView('details')" id="tab-details" class="py-4 px-4 font-black text-[10px] uppercase text-slate-400">Transactions</button>
        <button onclick="switchView('exp')" id="tab-exp" class="py-4 px-4 font-black text-[10px] uppercase text-slate-400">Expense</button>
        <button onclick="switchView('stock')" id="tab-stock" class="py-4 px-4 font-black text-[10px] uppercase text-slate-400">Stock</button>
    </nav>

    <div id="view-dash" class="p-4">
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <h3 class="font-black text-slate-800 mb-6 flex items-center justify-between italic">
                <span><i class="fas fa-wallet text-green-500 mr-2"></i>สรุปรายได้วันนี้</span>
                <span class="text-[10px] bg-slate-100 px-3 py-1 rounded-full text-slate-500" id="current-date-badge"></span>
            </h3>
            <div class="text-center mb-8">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">ยอดขายสุทธิ (100%)</p>
                <h1 id="today-gross" class="text-5xl font-black text-slate-800 tracking-tighter">฿0</h1>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-50 p-4 rounded-3xl">
                    <p class="text-[10px] text-blue-600 font-black uppercase mb-1">เงินทุน (70%)</p>
                    <input type="number" id="input-cap" oninput="manualAdjust()" class="bg-transparent text-2xl font-black text-slate-700 w-full outline-none">
                </div>
                <div class="bg-green-50 p-4 rounded-3xl">
                    <p class="text-[10px] text-green-600 font-black uppercase mb-1">กำไร (30%)</p>
                    <input type="number" id="input-prof" oninput="manualAdjust()" class="bg-transparent text-2xl font-black text-slate-700 w-full outline-none">
                </div>
            </div>
            <div class="mt-6 p-4 bg-slate-900 rounded-3xl text-white flex justify-between items-center">
                <p id="check-sum" class="text-xs font-black text-blue-400 italic">Balance OK</p>
                <div id="loading-spinner" class="hidden animate-spin h-5 w-5 border-2 border-white/20 border-t-white rounded-full"></div>
            </div>
        </div>
    </div>

    <div id="view-details" class="hidden p-4 space-y-4">
        <div class="flex bg-slate-200 p-1 rounded-2xl">
            <button onclick="setDetailMode('inc')" id="btn-m-inc" class="flex-1 py-2 rounded-xl text-[10px] font-black uppercase bg-white">Income</button>
            <button onclick="setDetailMode('exp')" id="btn-m-exp" class="flex-1 py-2 rounded-xl text-[10px] font-black uppercase">Expense</button>
        </div>
        <div id="income-list" class="space-y-2"></div>
        <div id="expense-list" class="hidden space-y-2"></div>
    </div>

    <div id="view-exp" class="hidden p-4">
        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl">
            <h3 class="font-black text-slate-800 mb-4 italic">บันทึกค่าใช้จ่าย</h3>
            <div class="space-y-3">
                <input type="text" id="exp-desc" placeholder="รายการจ่าย" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                <input type="number" id="exp-amount" placeholder="จำนวนเงิน" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-black text-2xl">
                <button onclick="saveExp()" id="btn-save-exp" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black">บันทึก</button>
            </div>
        </div>
    </div>

    <div id="view-stock" class="hidden p-4 space-y-4">
        <button onclick="openStockModal('', 0, 0, '')" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-black text-sm">เพิ่มสินค้าใหม่</button>
        <div id="full-stock-list" class="space-y-3"></div>
    </div>

    <div id="stock-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-6 space-y-3">
            <h3 class="font-black italic uppercase">จัดการสต๊อก</h3>
            <input type="text" id="s-name" placeholder="ชื่อสินค้า" class="w-full p-3 bg-slate-100 rounded-xl font-bold">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="s-qty" placeholder="จำนวน" class="p-3 bg-slate-100 rounded-xl font-bold">
                <input type="number" id="s-min" placeholder="ขั้นต่ำ" class="p-3 bg-slate-100 rounded-xl font-bold">
            </div>
            <input type="text" id="s-unit" placeholder="หน่วย" class="w-full p-3 bg-slate-100 rounded-xl font-bold">
            <div class="flex gap-2">
                <button onclick="closeStockModal()" class="flex-1 py-3 font-bold text-slate-400">ปิด</button>
                <button onclick="saveStock()" id="btn-save-stock" class="flex-1 bg-slate-900 text-white py-3 rounded-xl font-black">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzvzFVYW-XUcQxpTrDgR-l8X8IMSvbXdYEq2ppP3FmMXjsRk62lKpioNvck4CkdSj8kKg/exec";
        let currentGross = 0;

        function switchView(v) {
            ['dash','details','exp','stock'].forEach(i => {
                document.getElementById('view-'+i).classList.add('hidden');
                document.getElementById('tab-'+i).classList.remove('tab-active');
                document.getElementById('tab-'+i).classList.add('text-slate-400');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('tab-'+v).classList.add('tab-active');
            if(v === 'stock') loadStock();
        }

        function refreshData() {
            document.getElementById('loading-spinner').classList.remove('hidden');
            const now = new Date();
            const dateStr = `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getFullYear()+543}`;
            document.getElementById('display-date').innerText = dateStr;
            document.getElementById('current-date-badge').innerText = dateStr;

            const s = document.createElement('script');
            s.src = `${API}?action=getFinanceDetail&callback=renderAll&t=${Date.now()}`;
            document.body.appendChild(s);
        }

        window.renderAll = function(d) {
            document.getElementById('loading-spinner').classList.add('hidden');
            currentGross = d.todayIncome || 0;
            document.getElementById('today-gross').innerText = `฿${currentGross.toLocaleString()}`;
            
            const cap = Math.floor(currentGross * 0.7);
            const prof = currentGross - cap;
            document.getElementById('input-cap').value = cap;
            document.getElementById('input-prof').value = prof;
            document.getElementById('today-profit-top').innerText = `฿${prof.toLocaleString()}`;
            
            renderTransactions(d.details, d.expenses);
        };

        function renderTransactions(inc, exp) {
            document.getElementById('income-list').innerHTML = inc.map(i => `
                <div class="bg-white p-3 rounded-2xl shadow-sm border-l-4 border-green-500">
                    <div class="flex justify-between font-black text-xs"><span>${i.time}</span><span>฿${i.total}</span></div>
                    <p class="text-[10px] text-slate-500">${i.items}</p>
                </div>
            `).join('') || '<p class="text-center text-xs p-10">ไม่มีรายการขายวันนี้</p>';

            document.getElementById('expense-list').innerHTML = exp.map(e => `
                <div class="bg-white p-3 rounded-2xl shadow-sm border-l-4 border-red-500">
                    <div class="flex justify-between font-black text-xs"><span>${e.date}</span><span>฿${e.amount}</span></div>
                    <p class="text-[10px] text-slate-500">${e.desc}</p>
                </div>
            `).join('') || '<p class="text-center text-xs p-10">ไม่มีค่าใช้จ่าย</p>';
        }

        function setDetailMode(mode) {
            document.getElementById('income-list').classList.toggle('hidden', mode === 'exp');
            document.getElementById('expense-list').classList.toggle('hidden', mode === 'inc');
            document.getElementById('btn-m-inc').classList.toggle('bg-white', mode === 'inc');
            document.getElementById('btn-m-exp').classList.toggle('bg-white', mode === 'exp');
        }

        function loadStock() {
            const s = document.createElement('script');
            s.src = `${API}?action=getAllInventory&callback=renderStock`;
            document.body.appendChild(s);
        }

        window.renderStock = function(items) {
            document.getElementById('full-stock-list').innerHTML = items.map(i => {
                const isLow = parseFloat(i.stock) <= parseFloat(i.min);
                return `
                    <div class="bg-white p-4 rounded-3xl flex justify-between items-center ${isLow ? 'border-2 border-red-500' : ''}">
                        <div><p class="font-black text-sm">${i.item}</p><p class="text-[10px]">Min: ${i.min}</p></div>
                        <div class="text-right">
                            <p class="text-xl font-black ${isLow ? 'text-red-500' : ''}">${i.stock}</p>
                            <button onclick="openStockModal('${i.item}',${i.stock},${i.min},'${i.unit}')" class="text-blue-500 text-xs font-bold">แก้ไข</button>
                        </div>
                    </div>`;
            }).join('');
        };

        function openStockModal(n, q, m, u) {
            document.getElementById('s-name').value = n;
            document.getElementById('s-qty').value = q;
            document.getElementById('s-min').value = m;
            document.getElementById('s-unit').value = u;
            document.getElementById('stock-modal').classList.remove('hidden');
        }

        function closeStockModal() { document.getElementById('stock-modal').classList.add('hidden'); }

        function saveExp() {
            const desc = document.getElementById('exp-desc').value;
            const amt = document.getElementById('exp-amount').value;
            if(!desc || !amt) return alert('ใส่ข้อมูลให้ครบ');
            const s = document.createElement('script');
            s.src = `${API}?action=saveExpense&desc=${encodeURIComponent(desc)}&amount=${amt}&callback=afterAction`;
            document.body.appendChild(s);
        }

        function saveStock() {
            const n = document.getElementById('s-name').value;
            const q = document.getElementById('s-qty').value;
            const m = document.getElementById('s-min').value;
            const u = document.getElementById('s-unit').value;
            const s = document.createElement('script');
            s.src = `${API}?action=saveStock&item=${encodeURIComponent(n)}&qty=${q}&min=${m}&unit=${encodeURIComponent(u)}&callback=afterAction`;
            document.body.appendChild(s);
        }

        window.afterAction = function() {
            alert('สำเร็จ!');
            closeStockModal();
            refreshData();
        };

        window.onload = refreshData;
    </script>
</body>
</html>
