<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AMAMEE INSIGHT - Financial Controller</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #111827; color: white; }
        .tab-active { border-bottom: 3px solid #ef4444; color: #ef4444; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body class="bg-[#0f172a]">

    <header class="p-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black italic">AMAMEE <span class="text-red-500">INSIGHT</span></h1>
            <p class="text-[10px] text-slate-400 tracking-widest uppercase">Financial Controller</p>
        </div>
        <button onclick="fetchAllData()" class="bg-slate-800 p-2 rounded-full hover:bg-slate-700 transition">
            <span class="material-symbols-outlined text-sm">refresh</span>
        </button>
    </header>

    <div class="px-6 grid grid-cols-2 gap-4 mb-6">
        <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
            <p class="text-[10px] text-slate-400 mb-1">วันนี้</p>
            <p id="display-date" class="text-sm font-bold italic">26/02/2569</p>
        </div>
        <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
            <p class="text-[10px] text-slate-400 mb-1">กำไรวันนี้ (30%)</p>
            <p id="top-profit" class="text-xl font-black text-green-500 italic">฿0</p>
        </div>
    </div>

    <div class="flex justify-between px-6 border-b border-slate-800 text-[10px] font-bold uppercase tracking-tighter mb-8">
        <button onclick="nav('dashboard')" id="tab-dashboard" class="pb-2 tab-active">Dashboard</button>
        <button onclick="nav('transactions')" id="tab-transactions" class="pb-2 text-slate-500">Transactions</button>
        <button onclick="nav('expense')" id="tab-expense" class="pb-2 text-slate-500">Expense</button>
        <button onclick="nav('stock')" id="tab-stock" class="pb-2 text-slate-500">Stock</button>
    </div>

    <main id="page-dashboard" class="page active px-6">
        <div class="bg-white rounded-[40px] p-8 text-slate-900 shadow-xl">
            <div class="flex items-center gap-2 mb-6">
                <span class="material-symbols-outlined text-green-600">wallet</span>
                <h3 class="text-xl font-black italic">สรุปรายได้วันนี้</h3>
                <span class="ml-auto text-[9px] bg-slate-100 px-2 py-1 rounded-full text-slate-400">26/02/2569</span>
            </div>

            <div class="text-center mb-10">
                <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">ยอดขายสุทธิ (100%)</p>
                <h1 id="total-sales" class="text-6xl font-black italic">฿0</h1>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-blue-50 p-4 rounded-3xl">
                    <p class="text-[9px] text-blue-400 font-bold uppercase mb-1">เงินทุน (70%)</p>
                    <p id="total-capital" class="text-2xl font-black italic text-slate-800">0</p>
                </div>
                <div class="bg-green-50 p-4 rounded-3xl">
                    <p class="text-[9px] text-green-400 font-bold uppercase mb-1">กำไร (30%)</p>
                    <p id="total-profit" class="text-2xl font-black italic text-slate-800">0</p>
                </div>
            </div>

            <div class="bg-slate-900 text-blue-400 p-4 rounded-2xl flex items-center gap-2 italic font-bold text-xs">
                <span>Balance OK</span>
            </div>
        </div>
    </main>

    <main id="page-transactions" class="page px-6">
        <div class="bg-slate-800 rounded-3xl p-6 mb-4">
            <h2 class="font-bold mb-4">บันทึกรายรับ (ออเดอร์)</h2>
            <input type="number" id="input-amount" placeholder="ใส่ยอดขาย" class="w-full bg-slate-700 p-4 rounded-xl border-none text-2xl font-bold mb-4">
            <select id="input-method" class="w-full bg-slate-700 p-4 rounded-xl border-none mb-4">
                <option value="เงินโอน">เงินโอน</option>
                <option value="เงินสด">เงินสด</option>
            </select>
            <button onclick="saveData('income')" class="w-full bg-blue-600 p-4 rounded-xl font-bold uppercase italic">บันทึกยอดขาย</button>
        </div>

        <div id="log-list" class="space-y-2 mt-6">
            </div>
    </main>

    <script>
        // --- ส่วนที่ต้องนำข้อมูลจาก Supabase มาใส่ ---
        const SB_URL = 'SB_URL';
        const SB_KEY = 'SB_KEY';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button, div button').forEach(b => b.classList.remove('tab-active', 'text-slate-500'));
            
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('tab-' + id).classList.add('tab-active');
            if(id === 'dashboard') fetchAllData();
        }

        async function saveData(type) {
            const amt = parseFloat(document.getElementById('input-amount').value);
            const method = document.getElementById('input-method').value;
            if(!amt) return alert("กรุณาระบุจำนวนเงิน");

            // Logic คำนวณตาม UI ของคุณ: ทุน 70%, กำไร 30%
            const capital = amt * 0.7;
            const profit = amt * 0.3;

            const { error } = await sb.from('transactions').insert([{
                type: type,
                amount: amt,
                capital: capital,
                profit: profit,
                payment_method: method,
                title: 'ยอดขายรายวัน'
            }]);

            if(!error) {
                alert("บันทึกสำเร็จ!");
                document.getElementById('input-amount').value = '';
                nav('dashboard');
            }
        }

        async function fetchAllData() {
            const { data, error } = await sb.from('transactions').select('*').order('created_at', {ascending: false});
            if(data) {
                let s_total = 0, c_total = 0, p_total = 0;
                
                // กรองเฉพาะข้อมูลวันนี้
                const today = new Date().toLocaleDateString();
                data.forEach(item => {
                    if(new Date(item.created_at).toLocaleDateString() === today) {
                        s_total += item.amount;
                        c_total += item.capital;
                        p_total += item.profit;
                    }
                });

                document.getElementById('total-sales').innerText = '฿' + s_total.toLocaleString();
                document.getElementById('total-capital').innerText = c_total.toLocaleString();
                document.getElementById('total-profit').innerText = p_total.toLocaleString();
                document.getElementById('top-profit').innerText = '฿' + p_total.toLocaleString();
            }
        }

        window.onload = fetchAllData;
    </script>
</body>
</html>
