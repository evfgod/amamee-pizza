<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAMEE Manager - สรุปยอดและสต๊อก</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f1f5f9; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="p-4 space-y-6">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-black text-slate-800 italic">AMAMEE <span class="text-red-500">MANAGER</span></h1>
            <p class="text-xs font-bold text-slate-400">ระบบหลังบ้านและคุมสต๊อก</p>
        </div>
        <button onclick="refreshAll()" class="w-10 h-10 bg-white rounded-2xl shadow-sm text-slate-600 flex items-center justify-center">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <div class="grid grid-cols-1 gap-4">
        <div class="bg-white p-6 rounded-[2rem] card-shadow border-b-8 border-blue-500">
            <p class="text-sm font-bold text-slate-400 mb-1 uppercase tracking-wider">กำไรเป้าหมาย (30%) ของวันนี้</p>
            <h2 id="target-profit" class="text-4xl font-black text-slate-800">฿0</h2>
            <div id="cost-badge" class="mt-3 inline-block px-4 py-1 rounded-full text-[10px] font-black uppercase">กำลังคำนวณสถานะ...</div>
        </div>
    </div>

    <div class="bg-slate-800 p-6 rounded-[2rem] shadow-xl text-white">
        <h3 class="font-bold mb-4 flex items-center gap-2">
            <i class="fas fa-cart-plus text-yellow-400"></i> บันทึกซื้อของเข้า / รายจ่าย
        </h3>
        <div class="space-y-3">
            <input type="text" id="exp-desc" placeholder="เช่น ซื้อแป้งพิซซ่า 5 ถุง" class="w-full p-4 bg-white/10 rounded-2xl border-none text-white placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-yellow-400">
            <input type="number" id="exp-amount" placeholder="จำนวนเงิน" class="w-full p-4 bg-white/10 rounded-2xl border-none text-white placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-yellow-400">
            <button onclick="saveExpense()" class="w-full bg-yellow-400 text-slate-900 py-4 rounded-2xl font-black text-lg active:scale-95 transition-all">บันทึกข้อมูล</button>
        </div>
    </div>

    <div class="space-y-4">
        <div class="flex items-center justify-between">
            <h3 class="font-black text-slate-800 italic uppercase">Shopping List พรุ่งนี้</h3>
            <span class="text-[10px] bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold">Stock Alert</span>
        </div>
        <div id="shopping-list" class="space-y-3">
            </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw4eN6LuD_SMgXI5j_Hs1pVdd3emzBoz4nViUmL6LzUzRoL0AirJMRZrYwBqphgyee3yw/exec';

        async function refreshAll() {
            loadFinance();
            loadShoppingList();
        }

        function loadFinance() {
            const script = document.createElement('script');
            script.src = `${WEB_APP_URL}?action=getFinanceSummary&callback=finCB&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        window.finCB = function(data) {
            document.getElementById('target-profit').innerText = `฿${data.targetProfit.toLocaleString()}`;
            const badge = document.getElementById('cost-badge');
            badge.innerText = data.status;
            
            if(data.actualExpense > data.targetCost) {
                badge.className = "mt-3 inline-block px-4 py-1 rounded-full text-[10px] font-black uppercase bg-red-100 text-red-600";
            } else {
                badge.className = "mt-3 inline-block px-4 py-1 rounded-full text-[10px] font-black uppercase bg-green-100 text-green-600";
            }
        }

        function loadShoppingList() {
            const script = document.createElement('script');
            script.src = `${WEB_APP_URL}?action=getInventoryReport&callback=stockCB&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        window.stockCB = function(data) {
            const list = document.getElementById('shopping-list');
            if(data.length === 0) {
                list.innerHTML = `<div class="bg-white p-8 rounded-[2rem] text-center border-2 border-dashed border-slate-200">
                    <i class="fas fa-check-circle text-green-500 text-3xl mb-2"></i>
                    <p class="text-xs font-bold text-slate-400">สต๊อกยังเต็มอยู่ ไม่ต้องซื้ออะไรเพิ่ม</p>
                </div>`;
                return;
            }
            list.innerHTML = data.map(i => `
                <div class="bg-white p-5 rounded-[2rem] card-shadow flex justify-between items-center border-l-4 border-red-500">
                    <div>
                        <p class="font-black text-slate-800">${i.item}</p>
                        <p class="text-[10px] text-slate-400">เหลือในร้าน: ${i.stock} ${i.unit}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-red-500 font-black text-xs">ต้องซื้อเพิ่ม</p>
                        <p class="text-[9px] text-slate-300 font-bold uppercase">Min Limit: ${i.min}</p>
                    </div>
                </div>
            `).join('');
        }

        async function saveExpense() {
            const desc = document.getElementById('exp-desc').value;
            const amount = document.getElementById('exp-amount').value;
            if(!desc || !amount) return alert('กรุณากรอกข้อมูลให้ครบครับ');

            const params = new URLSearchParams({ action: 'saveExpense', desc: desc, amount: amount });
            await fetch(`${WEB_APP_URL}?${params.toString()}`, { mode: 'no-cors' });
            
            alert('บันทึกรายจ่ายเรียบร้อยแล้ว!');
            document.getElementById('exp-desc').value = '';
            document.getElementById('exp-amount').value = '';
            refreshAll();
        }

        window.onload = refreshAll;
    </script>
</body>
</html>
